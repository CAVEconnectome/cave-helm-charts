{{- if .Values.gmp.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: pcgl2cache
  labels:
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app: pcgl2cache
  endpoints:
  # The app itself serves no /metrics; the uwsgi-exporter sidecar does, and it
  # is what produces uwsgi_perc_busy_workers for the API scaler.
  - port: 9101
    interval: {{ .Values.gmp.scrape.interval | default "30s" }}
    path: /
{{- end }}
