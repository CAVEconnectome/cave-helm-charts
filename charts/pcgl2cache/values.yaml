# Rate limiting. Top-level `limiter:` matching annotation, pychunkedgraph and
# materializationengine, so the Terraform module fills it the same way it fills
# theirs -- redis.host comes from pcgl2cache.defaults.yaml, not by hand.
#
# Buckets by authenticated user id, not client address: every request arrives via
# the ingress and real clients sit behind shared NAT gateways, so an
# address-keyed limit would see one IP for the whole world. Per-user is what stops
# one caller's bulk job from starving everyone else.
limiter:
  redis:
    # Supplied by Terraform. EMPTY MEANS NOT ENFORCED: flask_limiter falls back to
    # per-process memory, so each of ~30 replicas x up to 16 uwsgi workers keeps
    # its own counter and the real ceiling is the configured value times ~480.
    # The app logs a warning when categories are set without this.
    host: ""
    db: 1   # separate db from any cache/job use on the same instance
  # Per-category limits, any flask_limiter syntax. Empty enforces nothing.
  categories:
    attributes: "600/minute"
    metadata: "60/minute"
  # Elevated ceilings for service-account tokens: internal callers funnel through
  # one endpoint and would otherwise exhaust a single bucket however many
  # replicas they run. Still a real limit, not an exemption.
  serviceAccountCategories:
    attributes: "6000/minute"
  serviceAccountOverrides: {}

cluster:
  dockerRegistry: docker.io/caveconnectome
  globalServer: ""
  dns_entries: []
  meshPool: standard-pool
  cluster_prefix: ""

pcgl2cache:
  tag: "1.3.1"
  ingress:
    proxyBodySize: "10m"
  api:
    enabled: true
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      cpuTarget: 80
    # Target percent of busy uWSGI workers for the KEDA prometheus trigger
    # (used only when keda.enabled and gmp.enabled). These requests are I/O
    # bound on BigTable, so workers saturate well before CPU does.
    busyWorkersTarget: 75
    resources:
      requests:
        memory: 900Mi
        cpu: 200m
      # Memory limit, always set. Without one, a container that outgrows its request is
      # not killed; instead the node fills and the kubelet evicts whichever pod most
      # exceeds its request -- taking down neighbours too. A limit turns that node-wide
      # eviction into a contained per-pod OOM kill.
      # Defaults to memLimitRatio x requests.memory. Set limits.memory to pin an explicit
      # value instead. No CPU limit (CPU is compressible; a limit would only throttle).
      #
      # NOTE: the limit must sit above real steady-state usage, not just above the
      # request. These API pods run 8 uwsgi workers minimum and idle well over 900Mi, so
      # a ratio near 1.0 would OOM-kill them on startup. Check actual usage per
      # deployment before lowering the ratio.
      # 2.0, not 1.5. The image's uwsgi.ini sets `cheaper = 8`, a FLOOR uwsgi never
      # drops below, and 8 workers under load measured ~147Mi each on minniev7:
      #   8 x 147Mi + ~170Mi (master + nginx + interpreter) = ~1346Mi
      # against the old 1350Mi limit -- 4Mi of headroom. The pods were not
      # over-scaling into an OOM, they did not fit at their MINIMUM worker count
      # once requests got heavy. Capping worker growth alone cannot fix that, which
      # is why this moved as well as pcgl2cache.api.uwsgi below.
      memLimitRatio: 2.0
      limits: {}
        # memory: 1500Mi   # explicit override; wins over memLimitRatio
    # uwsgi worker sizing, kept in the same place as the memory it consumes.
    #
    # The image's uwsgi.ini grows the worker pool on busyness (cheaper-algo =
    # busyness, +8 workers at a time, up to processes = 64) and only stops at
    # cheaper-rss-limit-soft, which the image sets to 6 GiB. Nothing in that
    # config knows what the container's memory limit is, so on a 1350Mi pod uwsgi
    # will happily spawn past it and be OOMKilled -- repeatedly. That is what
    # OOMKilled every pcgl2cache api pod on minniev7 (50+ restarts each) once an
    # external client started a sustained bulk sweep.
    #
    # Measured on that deployment: ~814Mi idle with the initial 8 workers, and
    # working set climbing to the 1350Mi limit under load.
    uwsgi:
      # Mount a uwsgi.ini over the image's own. Required for the two settings below
      # to have any effect at all: the container runs `uwsgi --ini
      # /etc/uwsgi/uwsgi.ini` and uwsgi applies that ini AFTER UWSGI_* env vars, so
      # environment variables cannot override it. The mounted file %includes the
      # image's original and then restates only these options.
      enabled: true
      # Fraction of the container memory limit at which uwsgi stops spawning NEW
      # workers. Not a cap on usage -- workers already running keep growing -- so
      # it must trip early enough that the remainder still fits.
      # 0.7 of the 1800Mi limit is ~1260Mi: the 8-worker floor (~1176Mi loaded)
      # still fits under it, a 9th trips the gate, and ~540Mi is left for the
      # workers already running to grow into.
      rssLimitFraction: 0.7
      # Hard ceiling on worker count, well below the ini's 64. At the ~100Mi per
      # worker measured here, 16 is already more than a 1350Mi pod can hold; the
      # RSS fraction above is what actually binds first. Raise the memory limit
      # and this together, never one alone.
      processes: 16
  worker:
    minReplicas: 0
    maxReplicas: 50
    cpuTarget: 90
    resources:
      requests:
        memory: 2500Mi
        cpu: 500m
      # Same scheme as api.resources above.
      memLimitRatio: 1.5
      limits: {}
        # memory: 4000Mi   # explicit override; wins over memLimitRatio
  queues:
    update: pcg-update-sub
    high: pcg-high-sub
    low: pcg-low-sub
  exchanges:
    update: pcg-update-exchange
    edits: pcg-edits-exchange
  bigtable:
    project: ""
    instance: your-bt-instance
  auth:
    uri: "https://example.org/auth"
    stickyUrl: "https://example.org/sticky_auth"
    authUrl: "https://example.org/auth"
    infoUrl: "https://example.org/auth_info"
  configVersion: 1
  config:
    configCfg: ""
    l2TableMap: ""
  # Files to include in the generated Kubernetes Secret. Values can be literal strings
  # or Helmfile ref+gcpsecrets:// URIs that resolve at apply time.
  secretFiles:
    - name: google-secret.json
      value: ""
    - name: cave-secret.json
      value: ""
  googleSecretFilename: google-secret.json
  caveSecretFilename: cave-secret.json

keda:
  enabled: true
  pollingSeconds: 15
  # cooldownPeriod = scale-to-ZERO delay; kept high so the deployment stays warm
  # between bursts and avoids cold starts. (Not the same as scaleDownStabilizationSeconds.)
  cooldownSeconds: 600
  # HPA scale-DOWN stabilization for scaling between non-zero replica counts (k8s default 300s).
  # Lowered so over-scaled idle workers drain quickly after a burst instead of lingering ~5 min.
  scaleDownStabilizationSeconds: 90
  activationValue: 0
  timeHorizon: "2m"
  valueIfNull: 0
  pubsub:
    # Target messages per worker. Workers process strictly serially (1 message at a
    # time, max_messages=1), so this trades scale-up latency for fewer, better-utilized
    # pods: desired = ceil(backlog / messagesPerWorker).
    messagesPerWorker: 2

service:
  type: NodePort

gmp:
  enabled: false
  scrape:
    interval: 30s
