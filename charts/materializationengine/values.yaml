annotation:
  # add to this if you want to exclude joint membership in a group name
  # from applying to group level permissions
  excludedPermissionGroups:
    - default
  # needs to be correspond to sql instance created
  # needs to correspond to a aligned volume that you created a database for
  healthAlignedVolumeName: ""
cloudsql:
  sqlInstanceName: ""
  googleSecret: ""
  username: "postgres"
  password: ""
limiter:
  redis:
    host: ""
materialize:
  # image tag; if empty defaults to Chart.appVersion; legacy .materialize.version still honored
  tag: ""
  # image tag for the celery metric exporter (caveconnectome/celery-metric-exporter)
  # v7 adds the celery_inflight_tasks gauge used by the KEDA in-flight triggers
  celeryExporterTag: "v7"
  # need to fill in
  datastacks:
    - ""
  secretFiles:
    # need to fill in with path to secret file
    - name: google-secret.json
      value: ""
    # need to fill in with path to secret file
    - name: cave-secret.json
      value: ""
  # needs to be set via a file
  schedules: ""
  # controls autoscaling but likely fine as is
  apiMinReplicas: 1
  apiMaxReplicas: 5
  producerMinReplicas: 0
  producerMaxReplicas: 5
  consumerMinReplicas: 0
  consumerMaxReplicas: 50
  # dedicated worker for deltalake queue
  deltalakeEnabled: true
  deltalakeMinReplicas: 1
  deltalakeMaxReplicas: 1
  # Output bucket for deltalake exports. If empty, defaults to
  # "<dumpBucketPath>/deltalake_exports". Set to override the location.
  deltalakeOutputBucket: ""
  # Delta Lake export memory tuning.
  # The export streams Postgres rows into an in-memory buffer and flushes
  # when it reaches deltalakeFlushThresholdBytes. Peak worker memory may be a
  # multiple of this value, not equal to it, so lower it if the deltalake
  # worker OOMs on large tables.
  deltalakeFlushThresholdBytes: 2147483648
  # Bounds memory during the post-export optimize (z-order/compact) step.
  deltalakeOptimizeTargetSizeBytes: ""
  deltalakeOptimizeMaxSpillSizeBytes: ""
  # KEDA scaling targets per-queue
  producerTargetQueueLength: 10
  consumerTargetQueueLength: 10
  deltalakeTargetQueueLength: 2
  schedulerReplicas: 1
  # control how many databases it will allow materialization to create
  minDatabases: 1
  maxDatabases: 3
  # limits queries to the api
  querylimit: 500000
  # Readiness/liveness probe timing for the materialize API pods (not the celery deployments,
  # which set their own). /health shares the uwsgi worker pool with real traffic, so too tight a
  # timeout reports a busy pod as an unhealthy one and removes it from the Service; too long a
  # period makes both detection and recovery coarse. Applies to both probes, so liveness cannot
  # restart a pod that readiness would have tolerated.
  # Ingress-level settings for the API.
  #
  # loadBalance: ingress-nginx supports round_robin (its default) and ewma. There is no
  # least_conn; ewma is the least-loaded equivalent. Default here is ewma because
  # round_robin routes without regard for whether a pod's uwsgi workers are free, which
  # concentrated load on a couple of saturated pods while most sat idle.
  ingress:
    loadBalance: ewma
    # How long nginx waits for the api before abandoning the request. Must stay ABOVE
    # uwsgi.harakiri (the chart fails the render otherwise) so the worker gives up first
    # and reports why, instead of computing a response nobody is still waiting for.
    proxyReadTimeout: 600
    proxySendTimeout: 360
  # uwsgi.ini for the api container, rendered from these values and mounted over
  # /app/uwsgi.ini with subPath (only that file is replaced; the application code in /app is
  # untouched). This is the supported way to tune the api's worker pool -- changing a value
  # here is a rollout, not an image rebuild, and the pod-template checksum triggers the
  # restart uwsgi needs to reread the file.
  #
  # Set enabled: false to fall back to whatever uwsgi.ini the image ships.
  #
  # NOTE: /etc/uwsgi/uwsgi.ini is loaded AFTER this file and wins on conflicts, so socket,
  # chmod-socket, need-app, die-on-term, hook-master-start and show-config cannot be
  # overridden here.
  uwsgi:
    enabled: true
    # Worker pool. Each worker costs ~70-100Mi PRIVATE rss on top of ~180Mi shared by the
    # prefork, so pod rss ~= 180 + processes * private -- `processes` is the main lever on
    # the pod's memory ceiling, and must be affordable on the node the api pool runs on.
    processes: 8
    cheaper: 4
    cheaperInitial: 4
    # Small on purpose: a step of 4 adds ~280-400Mi in a single move, which on an e2-small
    # api pool (1358Mi allocatable, already 99% committed by requests) took nodes past their
    # eviction threshold and got pods evicted at ~970Mi against a 670Mi request.
    cheaperStep: 2
    cheaperAlgo: busyness
    cheaperOverload: 20
    cheaperBusynessMultiplier: 3
    cheaperBusynessMax: 50
    cheaperBusynessMin: 20
    # Seconds before a stuck request is killed. Kept below ingress.proxyReadTimeout.
    harakiri: 500
    # Logs the request each killed worker was serving -- without this a harakiri tells you
    # nothing about which query caused it.
    harakiriVerbose: true
    # Memory guards, all in Mi. uwsgi's own units are inconsistent here
    # (cheaper-rss-limit-soft is bytes, reload-on-rss is megabytes); the chart converts, so
    # these are always Mi and the values file never carries a raw byte count.
    #
    # cheaperRssLimitSoftMi stops NEW workers spawning once the workers' COMBINED rss passes
    # it. Keep it high; it is a weak guard and a low value does harm. Measured 2026-08-18,
    # that sum runs 1.56x-3.23x the pod's real rss, so it is nearly uncorrelated with the
    # thing it appears to bound: a 6-worker pod summed to 1526Mi while using 472Mi, while a
    # 4-worker pod summed to 1086Mi while using 697Mi. At 1536Mi it throttled the pod with
    # headroom and ignored the fat one. Cap pod memory with `processes` and the container
    # limit instead.
    cheaperRssLimitSoftMi: 2500
    # Gracefully recycle a worker over this rss once its current request finishes. This is
    # the guard that actually fires, so keep it near the observed distribution: workers sit
    # at p50 248Mi / p90 257Mi with outliers at 309-318Mi. A worker's rss does not fall back
    # after an expensive query, so pod rss ratchets up with whatever queries landed there --
    # that, not worker count, drove pods to 888-906Mi against an 871Mi limit. 300Mi recycles
    # the outliers and leaves the p90 alone. Empty/0 disables.
    reloadOnRssMi: 300
    # Hard backstop: kill a worker at this rss immediately, mid-request. This is the guard
    # against a single runaway query; reload-on-rss cannot help because the offending
    # request never returns. Empty/0 disables.
    evilReloadOnRssMi: 600
    listen: 128
    bufferSize: 32768
    maxRequests: 5000
    workerReloadMercy: 600
    reloadMercy: 605
    pyAutoreload: 1
    enableThreads: true
    memoryReport: true
    statsPort: 9192
    # Raw uwsgi option lines appended verbatim, for anything not modelled above.
    extraOptions: []
  # Escape hatch: whole-file replacement for uwsgi.ini. When non-empty this is used verbatim
  # and every materialize.uwsgi.* value above is IGNORED. Intended for one-off debugging;
  # prefer the values above so the running config stays discoverable.
  uwsgiConfig: ""
  apiProbes:
    timeoutSeconds: 5
    periodSeconds: 20
  limitsQueryPerMinute: 300
  limitsFastQueryPerMinute: 2000
  # Optional higher per-minute ceiling on the live-query endpoint for callers whose token
  # reports service_account=true. Unset means service accounts get the normal limit, i.e.
  # no behaviour change. Set it when an internal batch consumer needs headroom without
  # relaxing limits for interactive users or that identity's other endpoints.
  limitsServiceAccountQueryPerMinute: ""
  # resources limits for the celery workers
  celeryProducerCpu: "100m"
  celeryProducerMemory: "400Mi"
  celeryConsumerCpu: "100m"
  celeryConsumerMemory: "400Mi"
  celeryDeltalakeCpu: "950m"
  celeryDeltalakeMemory: "4000Mi"
  # Optional memory ceiling for the deltalake worker. Empty means no limit
  # (Burstable), so a runaway export is killed by the node OOM killer and
  # may take neighbouring pods with it. Setting a limit turns that into a
  # cgroup OOM attributable to this container.
  celeryDeltalakeMemoryLimit: "8000Mi"
  celeryProducerConcurrency: 2
  celeryConsumerConcurrency: 2
  celeryDeltalakeConcurrency: 2
  # name of celery queues, likely fine as defaults
  producerQueueName: "workflow"
  consumerQueueName: "process"
  deltalakeQueueName: "deltalake"
  orchestrationQueueName: "orchestration"
  celeryDeltalakeWorkerName: "celery-deltalake"
  celeryDeltalakeCloudvolumeCacheBytes: "100000000"
  celeryDeltalakeCloudvolumeParallel: "10"
  orchestrationAsJobs: true
  orchestrationMaxJobs: 50
  orchestrationPollingInterval: 120
  orchestrationJobTimeout: 86400
  orchestrationJobTtlAfterFinished: 86400
  orchestrationAutoshutdownEnabled: true
  orchestrationAutoshutdownMaxTasks: 1
  orchestrationAutoshutdownDelaySeconds: 2
  # Idle timeout in seconds. Worker will shutdown if no tasks processed within this time.
  # Set to 0 to disable idle timeout (default: 0 = disabled)
  orchestrationIdleTimeoutSeconds: 300
  pychunkedgraphReadServiceUrl: "http://pychunkedgraph-read-service/"
  redis:
    # need to fill in with redis IP
    host: ""
    # likely fine
    port: "6379"
    password: ""
  # logging level: ERROR, WARNING, INFO, DEBUG (default: ERROR)
  loggingLevel: "ERROR"
  resources:
    requests:
      memory: "700Mi"
      cpu: "200m"
    # The api container's memory LIMIT is derived from the request above, so retuning the
    # request moves the ceiling with it and the two cannot drift apart. Normally this ratio
    # is the only memory knob you need.
    #
    # It must stay above real steady-state rss or it will OOMKill healthy pods: measured
    # ~460Mi at 4 uwsgi workers and ~740-970Mi at 8, i.e. up to ~1.4x a 670Mi request. It
    # must also stay low enough to actually contain a runaway -- without any limit an
    # over-allocating request does not fail alone, it pushes the NODE past its eviction
    # threshold and the kubelet evicts the pod, killing every other in-flight request on it
    # plus the /health probe that keeps it in the Service.
    #
    # Raise `uwsgi.processes` and this ratio together; more workers means more private rss.
    # Set to 0 to emit no limit at all (not recommended).
    memoryRequestLimitRatio: 1.5
    # Absolute override, wins over the ratio. Only for the rare case where the ceiling must
    # be pinned independently of the request.
    limits: {}
      # memory: "1200Mi"
cluster:
  # required to fill in or choose
  globalServer: ""
  environment: ""
  domainName: ""
  googleProject: ""
  # optional explicit Bigtable target for deltalake workers.
  # if empty, deltalake worker defaults to cluster.googleProject for project and "" for instance.
  bigtableProject: ""
  bigtableInstance: ""
  googleRegion: "us-east1"
  googleZone: "us-east1-b"
  # likely fine as defaults
  lightweightPool: "lightweight-pool"
  meshPool: "mesh-pool"
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"

keda:
  enabled: true

gmp:
  enabled: true
  scrape:
    interval: 30s
    path: /
    port: 9101
