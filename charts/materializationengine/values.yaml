annotation:
  # add to this if you want to exclude joint membership in a group name
  # from applying to group level permissions
  excludedPermissionGroups:
    - default
  # needs to be correspond to sql instance created
  # needs to correspond to a aligned volume that you created a database for
  healthAlignedVolumeName: ""
cloudsql:
  sqlInstanceName: ""
  googleSecret: ""
  username: "postgres"
  password: ""
limiter:
  redis:
    host: ""
materialize:
  # image tag; if empty defaults to Chart.appVersion; legacy .materialize.version still honored
  tag: ""
  # image tag for the celery metric exporter (caveconnectome/celery-metric-exporter)
  # v7 adds the celery_inflight_tasks gauge used by the KEDA in-flight triggers
  celeryExporterTag: "v7"
  # need to fill in
  datastacks:
    - ""
  secretFiles:
    # need to fill in with path to secret file
    - name: google-secret.json
      value: ""
    # need to fill in with path to secret file
    - name: cave-secret.json
      value: ""
  # needs to be set via a file
  schedules: ""
  # controls autoscaling but likely fine as is
  apiMinReplicas: 1
  apiMaxReplicas: 5
  producerMinReplicas: 0
  producerMaxReplicas: 5
  consumerMinReplicas: 0
  consumerMaxReplicas: 50
  # dedicated worker for deltalake queue
  deltalakeEnabled: true
  deltalakeMinReplicas: 1
  deltalakeMaxReplicas: 1
  # Output bucket for deltalake exports. If empty, defaults to
  # "<dumpBucketPath>/deltalake_exports". Set to override the location.
  deltalakeOutputBucket: ""
  # Delta Lake export memory tuning.
  # The export streams Postgres rows into an in-memory buffer and flushes
  # when it reaches deltalakeFlushThresholdBytes. Peak worker memory may be a
  # multiple of this value, not equal to it, so lower it if the deltalake
  # worker OOMs on large tables.
  deltalakeFlushThresholdBytes: 2147483648
  # Bounds memory during the post-export optimize (z-order/compact) step.
  deltalakeOptimizeTargetSizeBytes: ""
  deltalakeOptimizeMaxSpillSizeBytes: ""
  # KEDA scaling targets per-queue
  producerTargetQueueLength: 10
  consumerTargetQueueLength: 10
  deltalakeTargetQueueLength: 2
  schedulerReplicas: 1
  # control how many databases it will allow materialization to create
  minDatabases: 1
  maxDatabases: 3
  # limits queries to the api
  querylimit: 500000
  # Readiness/liveness probe timing for the materialize API pods (not the celery deployments,
  # which set their own). /health shares the uwsgi worker pool with real traffic, so too tight a
  # timeout reports a busy pod as an unhealthy one and removes it from the Service; too long a
  # period makes both detection and recovery coarse. Applies to both probes, so liveness cannot
  # restart a pod that readiness would have tolerated.
  # Ingress-level settings for the API.
  #
  # loadBalance: ingress-nginx supports round_robin (its default) and ewma. There is no
  # least_conn; ewma is the least-loaded equivalent. Default here is ewma because
  # round_robin routes without regard for whether a pod's uwsgi workers are free, which
  # concentrated load on a couple of saturated pods while most sat idle.
  ingress:
    loadBalance: ewma
  # Optional replacement for the image's /app/uwsgi.ini, mounted with subPath so only that
  # one file is replaced and the application code in /app is untouched. Empty (default)
  # uses whatever the image ships. Set it to retune harakiri/processes/cheaper with a
  # rollout instead of an image rebuild; a pod restart is needed either way because uwsgi
  # reads the file only at startup, and the checksum annotation triggers one on change.
  #
  # NOTE: /etc/uwsgi/uwsgi.ini is loaded AFTER this file and wins on conflicts, so socket,
  # chmod-socket, need-app, die-on-term, hook-master-start and show-config cannot be
  # overridden here.
  uwsgiConfig: ""
  apiProbes:
    timeoutSeconds: 5
    periodSeconds: 20
  limitsQueryPerMinute: 300
  limitsFastQueryPerMinute: 2000
  # Optional higher per-minute ceiling on the live-query endpoint for callers whose token
  # reports service_account=true. Unset means service accounts get the normal limit, i.e.
  # no behaviour change. Set it when an internal batch consumer needs headroom without
  # relaxing limits for interactive users or that identity's other endpoints.
  limitsServiceAccountQueryPerMinute: ""
  # resources limits for the celery workers
  celeryProducerCpu: "100m"
  celeryProducerMemory: "400Mi"
  celeryConsumerCpu: "100m"
  celeryConsumerMemory: "400Mi"
  celeryDeltalakeCpu: "950m"
  celeryDeltalakeMemory: "4000Mi"
  # Optional memory ceiling for the deltalake worker. Empty means no limit
  # (Burstable), so a runaway export is killed by the node OOM killer and
  # may take neighbouring pods with it. Setting a limit turns that into a
  # cgroup OOM attributable to this container.
  celeryDeltalakeMemoryLimit: "8000Mi"
  celeryProducerConcurrency: 2
  celeryConsumerConcurrency: 2
  celeryDeltalakeConcurrency: 2
  # name of celery queues, likely fine as defaults
  producerQueueName: "workflow"
  consumerQueueName: "process"
  deltalakeQueueName: "deltalake"
  orchestrationQueueName: "orchestration"
  celeryDeltalakeWorkerName: "celery-deltalake"
  celeryDeltalakeCloudvolumeCacheBytes: "100000000"
  celeryDeltalakeCloudvolumeParallel: "10"
  orchestrationAsJobs: true
  orchestrationMaxJobs: 50
  orchestrationPollingInterval: 120
  orchestrationJobTimeout: 86400
  orchestrationJobTtlAfterFinished: 86400
  orchestrationAutoshutdownEnabled: true
  orchestrationAutoshutdownMaxTasks: 1
  orchestrationAutoshutdownDelaySeconds: 2
  # Idle timeout in seconds. Worker will shutdown if no tasks processed within this time.
  # Set to 0 to disable idle timeout (default: 0 = disabled)
  orchestrationIdleTimeoutSeconds: 300
  pychunkedgraphReadServiceUrl: "http://pychunkedgraph-read-service/"
  redis:
    # need to fill in with redis IP
    host: ""
    # likely fine
    port: "6379"
    password: ""
  # logging level: ERROR, WARNING, INFO, DEBUG (default: ERROR)
  loggingLevel: "ERROR"
  resources:
    requests:
      memory: "700Mi"
      cpu: "200m"
cluster:
  # required to fill in or choose
  globalServer: ""
  environment: ""
  domainName: ""
  googleProject: ""
  # optional explicit Bigtable target for deltalake workers.
  # if empty, deltalake worker defaults to cluster.googleProject for project and "" for instance.
  bigtableProject: ""
  bigtableInstance: ""
  googleRegion: "us-east1"
  googleZone: "us-east1-b"
  # likely fine as defaults
  lightweightPool: "lightweight-pool"
  meshPool: "mesh-pool"
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"

keda:
  enabled: true

gmp:
  enabled: true
  scrape:
    interval: 30s
    path: /
    port: 9101
