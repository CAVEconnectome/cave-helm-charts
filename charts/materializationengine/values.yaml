annotation:
  # add to this if you want to exclude joint membership in a group name
  # from applying to group level permissions
  excludedPermissionGroups:
    - default
  # needs to be correspond to sql instance created
  # needs to correspond to a aligned volume that you created a database for
  healthAlignedVolumeName: ""
cloudsql:
  # google project of the sql instance; if empty, defaults to cluster.googleProject
  projectId: ""
  sqlInstanceName: ""
  googleSecret: ""
  username: "postgres"
  password: ""
limiter:
  redis:
    host: ""
materialize:
  # image tag; if empty defaults to Chart.appVersion; legacy .materialize.version still honored
  tag: ""
  # image tag for the celery metric exporter (caveconnectome/celery-metric-exporter)
  # v7 adds the celery_inflight_tasks gauge used by the KEDA in-flight triggers
  # v8 stops the exporter reclaiming other workers' in-flight tasks (see celery.* below)
  celeryExporterTag: "v8"
  # Settings shared by every process that connects to this redis as a celery broker.
  #
  # These exist in one place because they are not per-process settings in practice: the
  # broker's `unacked` index is GLOBAL, and kombu's restore path reclaims any message
  # older than the visibility timeout of *whichever* connection happens to notice it. So
  # the effective timeout for the whole broker is the SMALLEST one configured by any
  # connected client -- a monitoring sidecar left on kombu's 3600s default silently
  # requeues a worker's still-running task, which is what happened to a deltalake export
  # on 2026-08-25: redelivered 3,677s in, and the duplicate failure took the original down
  # with it.
  #
  # Applies to ALL four client types on this broker, which is the point of having it in one
  # place:
  #   - the materializationengine workers + beat, via BROKER_TRANSPORT_OPTIONS in the two
  #     config.cfg ConfigMaps (configmap.yaml, orchestration_configmap.yaml)
  #   - flower, via the celeryconfig module in celery_broker_configmap.yaml
  #   - the celery metric exporter, via --visibility-timeout (needs image v8 or newer)
  #
  # How the worker path works: create_celery() in celery_worker.py hardcodes a new-style
  # broker_transport_options dict, then ends with celery.conf.update(app.config). Celery
  # aliases the legacy uppercase BROKER_TRANSPORT_OPTIONS onto the new-style key, so the
  # value from config.cfg lands last and wins -- verified against celery 5.5.3 by
  # replaying create_celery's exact statement sequence. Two things this depends on:
  #   1. It REPLACES the dict rather than merging, so config.cfg restates socket_timeout
  #      and socket_connect_timeout. Dropping them from the ConfigMap drops them for real.
  #   2. It only works because nothing reads celery.conf between the hardcoded update and
  #      the app.config update. A read there would finalize the settings namespace early
  #      and the uppercase alias would be ignored. If a MaterializationEngine change ever
  #      inserts a conf read into that gap, the workers silently revert to 21600 -- check
  #      `celery.conf.broker_transport_options` in a worker shell after upgrading.
  # Making create_celery read this from app.config directly would remove both caveats.
  #
  # Raising this above 21600 is safe; lowering it re-creates the bug for whichever client
  # gets the lower value. It must be longer than the longest task any worker runs.
  celery:
    visibilityTimeout: 21600
  # need to fill in
  datastacks:
    - ""
  secretFiles:
    # need to fill in with path to secret file
    - name: google-secret.json
      value: ""
    # need to fill in with path to secret file
    - name: cave-secret.json
      value: ""
  # needs to be set via a file
  schedules: ""
  # controls autoscaling but likely fine as is
  apiMinReplicas: 1
  apiMaxReplicas: 5
  # KEDA scale-out target for the api, as a percentage of uwsgi workers busy. The fleet is scaled
  # to hold the mean busy-% at this value, so this is where scaling "happens".
  #
  # Must stay BELOW apiProbes.readyMaxBusyFraction * 100 (currently 62.5) so replicas are added
  # before pods start shedding. The two form a ladder: at 50% grow the fleet, and only if load
  # keeps climbing past 62.5% on a given pod does that pod refuse traffic. Inverting them means
  # pods drop out of the Service while the deployment is still sized for the old load, which
  # concentrates the same traffic onto fewer endpoints.
  apiTargetBusyPercent: 50
  apiTargetCpuPercent: 75
  producerMinReplicas: 0
  producerMaxReplicas: 5
  consumerMinReplicas: 0
  consumerMaxReplicas: 50
  # dedicated worker for deltalake queue
  deltalakeEnabled: true
  deltalakeMinReplicas: 1
  deltalakeMaxReplicas: 1
  # Output bucket for deltalake exports. If empty, defaults to
  # "<dumpBucketPath>/deltalake_exports". Set to override the location.
  deltalakeOutputBucket: ""
  # Node pool for the deltalake worker. Empty means cluster.standardPool, which is
  # non-preemptible -- see the comment in templates/celery_deltalake.yaml. Set this to the
  # value of cluster.meshPool to put it back on preemptible nodes.
  deltalakePool: ""
  # Delta Lake export memory tuning.
  # The export streams Postgres rows into an in-memory buffer and flushes
  # when it reaches deltalakeFlushThresholdBytes. Peak worker memory may be a
  # multiple of this value, not equal to it, so lower it if the deltalake
  # worker OOMs on large tables. Lowered to 512Mb for the default values 
  # to make large scale tables work with the current default memory settings (aug 25,2026)
  deltalakeFlushThresholdBytes: 536870912
  # Bounds memory during the post-export optimize (z-order/compact) step.
  #
  # deltalakeOptimizeMaxSpillSizeBytes is the bytes z-order may hold in memory before
  # spilling to disk. Left empty, delta-rs picks its own default, which is far above this
  # container's limit -- so z-order never spills, and peak memory tracks the size of the
  # LARGEST partition instead. That is what killed the v1822 synapses_pni_2 export on
  # 2026-08-26: the export itself finished, three of the four lakes optimized flat at
  # ~1.2 GiB, and the fourth (ctr_pt_position_morton, whose largest partition is 3.4 GiB)
  # went 1.2 -> 3.3 GiB and was OOMKilled.
  #
  # Setting it decouples peak from partition size: measured on a 1.8 GB partition,
  # unset peaked at 2593 MB while 1 GiB peaked at 1204 MB, and the same 1 GiB setting on a
  # 0.9 GB partition peaked at 504 MB. Wall time was flat (23.1-24.3 s) across every value
  # tested, so there is no speed reason to raise this.
  #
  # Do NOT set it too low: 128 MiB does not spill gracefully, it fails the optimize with
  # "DeltaError: Z-order failed while scanning data". 256 MiB was the smallest that worked.
  # Spilling needs scratch space in the container's filesystem (~20 GB free, no
  # ephemeral-storage limit set).
  deltalakeOptimizeMaxSpillSizeBytes: 1073741824
  # Target output file size for optimize. Empty uses delta.targetFileSize (256 MB).
  deltalakeOptimizeTargetSizeBytes: ""
  # KEDA scaling targets per-queue
  producerTargetQueueLength: 10
  consumerTargetQueueLength: 10
  deltalakeTargetQueueLength: 2
  schedulerReplicas: 1
  # control how many databases it will allow materialization to create
  minDatabases: 1
  maxDatabases: 3
  # limits queries to the api
  querylimit: 500000
  # Readiness/liveness probe timing for the materialize API pods (not the celery deployments,
  # which set their own). /health shares the uwsgi worker pool with real traffic, so too tight a
  # timeout reports a busy pod as an unhealthy one and removes it from the Service; too long a
  # period makes both detection and recovery coarse. Applies to both probes, so liveness cannot
  # restart a pod that readiness would have tolerated.
  # Ingress-level settings for the API.
  #
  # loadBalance: ingress-nginx supports round_robin (its default) and ewma. There is no
  # least_conn; ewma is the least-loaded equivalent. Default here is ewma because
  # round_robin routes without regard for whether a pod's uwsgi workers are free, which
  # concentrated load on a couple of saturated pods while most sat idle.
  ingress:
    loadBalance: ewma
    # How long nginx waits for the api before abandoning the request. Must stay ABOVE
    # uwsgi.harakiri (the chart fails the render otherwise) so the worker gives up first
    # and reports why, instead of computing a response nobody is still waiting for.
    proxyReadTimeout: 600
    proxySendTimeout: 360
    # Max request body the ingress accepts. ingress-nginx defaults to 1m, which /query can exceed
    # because filter_in_dict carries a root-id list in the POST body (~20 bytes per id, so ~50k ids
    # is 1m). Over the cap the ingress returns its own 413 page and the api never sees the request,
    # so there is nothing app-side to debug. 10m matches pychunkedgraph, pcgl2cache and tourguide.
    proxyBodySize: "10m"
  # uwsgi.ini for the api container, rendered from these values and mounted over
  # /app/uwsgi.ini with subPath (only that file is replaced; the application code in /app is
  # untouched). This is the supported way to tune the api's worker pool -- changing a value
  # here is a rollout, not an image rebuild, and the pod-template checksum triggers the
  # restart uwsgi needs to reread the file.
  #
  # Set enabled: false to fall back to whatever uwsgi.ini the image ships.
  #
  # NOTE: /etc/uwsgi/uwsgi.ini is loaded AFTER this file and wins on conflicts, so socket,
  # chmod-socket, need-app, die-on-term, hook-master-start and show-config cannot be
  # overridden here.
  uwsgi:
    enabled: true
    # Worker pool. Each worker costs private rss on top of the shared prefork pages, so this is
    # the main lever on the pod's memory ceiling and must be affordable on the api pool's nodes.
    #
    # NOTE `processes` and `cheaper` are ALSO emitted as UWSGI_PROCESSES / UWSGI_CHEAPER env vars
    # by api.yaml, because the base image bakes those env vars and they beat uwsgi.ini. Set them
    # here only; the chart keeps the two in sync.
    #
    # 16 is headroom, not target capacity. Readiness sheds traffic at
    # apiProbes.readyMaxBusyFraction (0.625 => 10 busy), so the upper 6 workers exist purely to
    # absorb requests that keep arriving during the probe's detection delay. Sizing the pool at
    # the shed point instead would mean saturation and shedding coincide, and everything arriving
    # in the detection window would queue in the listen backlog with nowhere to go.
    processes: 16
    cheaper: 4
    cheaperInitial: 4
    # Small on purpose: a step of 4 adds ~280-400Mi in a single move, which on an e2-small
    # api pool (1358Mi allocatable, already 99% committed by requests) took nodes past their
    # eviction threshold and got pods evicted at ~970Mi against a 670Mi request.
    cheaperStep: 2
    cheaperAlgo: busyness
    cheaperOverload: 20
    cheaperBusynessMultiplier: 3
    cheaperBusynessMax: 50
    cheaperBusynessMin: 20
    # Seconds before a stuck request is killed. Kept below ingress.proxyReadTimeout.
    harakiri: 500
    # Logs the request each killed worker was serving -- without this a harakiri tells you
    # nothing about which query caused it.
    harakiriVerbose: true
    # Memory guards, all in Mi. uwsgi's own units are inconsistent here
    # (cheaper-rss-limit-soft is bytes, reload-on-rss is megabytes); the chart converts, so
    # these are always Mi and the values file never carries a raw byte count.
    #
    # cheaperRssLimitSoftMi stops NEW workers spawning once the workers' COMBINED rss passes
    # it. Keep it high; it is a weak guard and a low value does harm. Measured 2026-08-18,
    # that sum runs 1.56x-3.23x the pod's real rss, so it is nearly uncorrelated with the
    # thing it appears to bound: a 6-worker pod summed to 1526Mi while using 472Mi, while a
    # 4-worker pod summed to 1086Mi while using 697Mi. At 1536Mi it throttled the pod with
    # headroom and ignored the fat one. Cap pod memory with `processes` and the container
    # limit instead.
    cheaperRssLimitSoftMi: 2500
    # Gracefully recycle a worker over this rss once its current request finishes. This is
    # the guard that actually fires, so keep it near the observed distribution: workers sit
    # at p50 248Mi / p90 257Mi with outliers at 309-318Mi. A worker's rss does not fall back
    # after an expensive query, so pod rss ratchets up with whatever queries landed there --
    # that, not worker count, drove pods to 888-906Mi against an 871Mi limit. 300Mi recycles
    # the outliers and leaves the p90 alone. Empty/0 disables.
    reloadOnRssMi: 300
    # Hard backstop: kill a worker at this rss immediately, mid-request. This is the guard
    # against a single runaway query; reload-on-rss cannot help because the offending
    # request never returns. Empty/0 disables.
    evilReloadOnRssMi: 600
    listen: 128
    bufferSize: 32768
    maxRequests: 5000
    workerReloadMercy: 600
    reloadMercy: 605
    pyAutoreload: 1
    enableThreads: true
    memoryReport: true
    statsPort: 9192
    # Raw uwsgi option lines appended verbatim, for anything not modelled above.
    extraOptions: []
  # Escape hatch: whole-file replacement for uwsgi.ini. When non-empty this is used verbatim
  # and every materialize.uwsgi.* value above is IGNORED. Intended for one-off debugging;
  # prefer the values above so the running config stays discoverable.
  uwsgiConfig: ""
  apiProbes:
    timeoutSeconds: 5
    periodSeconds: 20
    # Probe paths. The split matters: readiness drains a busy-or-DB-broken pod (cheap, reversible)
    # while liveness restarts only a pod a restart would fix. Both pointed at /health before,
    # which does a database query on the shared uwsgi worker pool -- so a busy pod got restarted,
    # and a pod with a corrupted pool would have drained forever without ever being restarted.
    # Set both to /health to fall back to the old single-endpoint behaviour.
    readyPath: /health/ready
    livePath: /health/live
    # Gates liveness and readiness until the app has booted once. Keep this enabled: without it,
    # liveness kills the container at initialDelaySeconds + failureThreshold*periodSeconds (~55s),
    # but app boot measured p50 14s idle and p50 40-45s during a fleet-wide restart with a tail past
    # 75s -- because create_app runs db.create_all() and a GCS configure_cors(), so boot time scales
    # with how many pods start simultaneously. The result was 57 restarts across 51 pods and a
    # CrashLoopBackOff, each kill forcing another cold boot that made the next one slower.
    # 36 * 5s = 180s of boot budget. Overshooting only delays detection of a truly dead container on
    # first start; undershooting crash-loops the fleet.
    startup:
      enabled: true
      periodSeconds: 5
      failureThreshold: 36
    # Liveness must stay MORE tolerant than readiness. /health is served by the same uwsgi worker
    # pool as real traffic, so a busy pod fails it. Readiness failing just drains the pod (cheap and
    # correct); liveness failing restarts it and drops in-flight requests. With identical thresholds
    # they always tripped together, so busy pods were killed rather than drained.
    liveness:
      failureThreshold: 6
    # Readiness is deliberately FASTER than the shared periodSeconds. It is the load-shedding
    # signal, so its latency is the window during which a saturating pod keeps taking traffic:
    # at 20s/3 a pod needed ~60s to leave the Service, long enough to fill every remaining worker.
    # 10s/2 drains in ~20s. Keep failureThreshold >= 2 so one slow probe does not drain a pod.
    readiness:
      periodSeconds: 10
      failureThreshold: 2
    # Fraction of uwsgi worker SLOTS busy at which a pod reports NOT ready and traffic drains to
    # other replicas. Denominator is uwsgi.processes (16), not the number currently spawned, so a
    # pool that cheaper can still grow into is not drained prematurely.
    #
    # 0.625 => sheds at 10 of 16 busy (the check is >=, so exactly 10 triggers it), leaving 6
    # workers to absorb whatever arrives during the ~20s readiness detection delay. Set to 0 to
    # disable busy-based shedding and leave readiness a pure database check.
    #
    # This pairs with materialize.apiTargetBusyPercent (50): scale-out at 50% comes first, and a
    # pod only refuses traffic if it climbs a further 12.5 points to 62.5%. Keep that ordering --
    # shedding below the scale-out target makes pods leave the Service before replicas are added.
    #
    # CAUTION there is no cluster-wide floor on readiness: if every replica saturates at once they
    # all drain, the Service loses every endpoint and the ingress returns 503, which is worse than
    # queueing. The 50/62.5 ladder is what keeps that from happening, so if you lower this, lower
    # apiTargetBusyPercent with it and verify scale-out still outruns shedding under a real burst.
    readyMaxBusyFraction: 0.625
  # Per-request RSS accounting (materializationengine/memory_audit.py). Logs a JSON record on the
  # way IN and on the way OUT of every request, so a request the kernel OOM-kills leaves a `start`
  # with no matching `end` -- the only way to identify such a request, since a SIGKILLed worker runs
  # no exception handler, no after_request and no teardown_request.
  #
  # Default OFF because it roughly doubles the api's log volume: two lines per request, and at
  # ~450 skeletons/min with several materialize calls each that is thousands of lines per minute.
  # Turn it on to diagnose memory problems, then turn it back off.
  #
  # NOTE the application default is ON (config.py), so this chart always emits
  # MEMORY_AUDIT_ENABLED explicitly -- otherwise setting enabled: false here would emit nothing and
  # the code default would silently re-enable it.
  memoryAudit:
    enabled: false
    # A completed request whose RSS grew by at least this many Mi is logged at WARNING instead of
    # INFO, so the expensive ones stand out from the stream.
    warnDeltaMb: 100
    # Bodies larger than this are not introspected: get_json caches the raw bytes and the parsed
    # object, so parsing a huge filter payload would add tens of Mi to the very request most likely
    # to be near the memory ceiling. Its size alone still gets logged.
    maxBodyBytes: 2097152
    # Filters with at most this many values are logged WITH their values, which is what makes an
    # offending request identifiable; longer ones degrade to a count. Root ids are logged as
    # strings because they exceed 2**53 and a double-parsing consumer would corrupt them.
    maxFilterValues: 8
  limitsQueryPerMinute: 300
  limitsFastQueryPerMinute: 2000
  # Optional higher per-minute ceiling on the live-query endpoint for callers whose token
  # reports service_account=true. Unset means service accounts get the normal limit, i.e.
  # no behaviour change. Set it when an internal batch consumer needs headroom without
  # relaxing limits for interactive users or that identity's other endpoints.
  limitsServiceAccountQueryPerMinute: ""
  # resources limits for the celery workers
  celeryProducerCpu: "100m"
  celeryProducerMemory: "400Mi"
  celeryConsumerCpu: "100m"
  celeryConsumerMemory: "400Mi"
  celeryDeltalakeCpu: "950m"
  celeryDeltalakeMemory: "4000Mi"
  # Optional memory ceiling for the deltalake worker. Empty means no limit
  # (Burstable), so a runaway export is killed by the node OOM killer and
  # may take neighbouring pods with it. Setting a limit turns that into a
  # cgroup OOM attributable to this container.
  celeryDeltalakeMemoryLimit: "8000Mi"
  celeryProducerConcurrency: 2
  celeryConsumerConcurrency: 2
  celeryDeltalakeConcurrency: 2
  # name of celery queues, likely fine as defaults
  producerQueueName: "workflow"
  consumerQueueName: "process"
  deltalakeQueueName: "deltalake"
  orchestrationQueueName: "orchestration"
  # Unused: WORKER_NAME is derived from deltalakeQueueName so it always matches the
  # --hostname the worker registers under. Kept so existing overrides do not error.
  celeryDeltalakeWorkerName: "celery-deltalake"
  # How long Kubernetes waits for the deltalake worker to drain before SIGKILL. Must
  # exceed the longest export, because the shutdown hook waits for the running task and
  # the export cannot resume if it is cut short. 3 hours.
  celeryDeltalakeTerminationGracePeriodSeconds: 10800
  celeryDeltalakeCloudvolumeCacheBytes: "100000000"
  celeryDeltalakeCloudvolumeParallel: "10"
  orchestrationAsJobs: true
  orchestrationMaxJobs: 50
  orchestrationPollingInterval: 120
  orchestrationJobTimeout: 86400
  orchestrationJobTtlAfterFinished: 86400
  orchestrationAutoshutdownEnabled: true
  orchestrationAutoshutdownMaxTasks: 1
  orchestrationAutoshutdownDelaySeconds: 2
  # Idle timeout in seconds. Worker will shutdown if no tasks processed within this time.
  # Set to 0 to disable idle timeout (default: 0 = disabled)
  orchestrationIdleTimeoutSeconds: 300
  pychunkedgraphReadServiceUrl: "http://pychunkedgraph-read-service/"
  redis:
    # need to fill in with redis IP
    host: ""
    # likely fine
    port: "6379"
    password: ""
  # logging level: ERROR, WARNING, INFO, DEBUG (default: ERROR)
  loggingLevel: "ERROR"
  resources:
    requests:
      memory: "700Mi"
      cpu: "200m"
    # The api container's memory LIMIT is derived from the request above, so retuning the
    # request moves the ceiling with it and the two cannot drift apart. Normally this ratio
    # is the only memory knob you need.
    #
    # It must stay above real steady-state rss or it will OOMKill healthy pods: measured
    # ~460Mi at 4 uwsgi workers and ~740-970Mi at 8, i.e. up to ~1.4x a 670Mi request. It
    # must also stay low enough to actually contain a runaway -- without any limit an
    # over-allocating request does not fail alone, it pushes the NODE past its eviction
    # threshold and the kubelet evicts the pod, killing every other in-flight request on it
    # plus the /health probe that keeps it in the Service.
    #
    # Raise `uwsgi.processes` and this ratio together; more workers means more private rss.
    # Set to 0 to emit no limit at all (not recommended).
    memoryRequestLimitRatio: 1.5
    # Absolute override, wins over the ratio. Only for the rare case where the ceiling must
    # be pinned independently of the request.
    limits: {}
      # memory: "1200Mi"
cluster:
  # required to fill in or choose
  globalServer: ""
  environment: ""
  domainName: ""
  googleProject: ""
  # optional explicit Bigtable target for deltalake workers.
  # if empty, deltalake worker defaults to cluster.googleProject for project and "" for instance.
  bigtableProject: ""
  bigtableInstance: ""
  googleRegion: "us-east1"
  googleZone: "us-east1-b"
  # likely fine as defaults
  lightweightPool: "lightweight-pool"
  meshPool: "mesh-pool"
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"

keda:
  enabled: true

gmp:
  enabled: true
  scrape:
    interval: 30s
    path: /
    port: 9101

# Ephemeral RayJob platform, for long-running jobs that Celery-over-Redis
# struggles with -- the RayJob CR becomes the durable unit of work, so there is
# no broker, no ack, no visibility timeout and no redelivery.
#
# Nothing here creates a Ray cluster. The chart renders only the RBAC, the
# credentials Secret and the RayJob pod-spec skeleton; the api creates a RayJob
# per request, KubeRay stands up a cluster, runs it, and deletes it. No Ray
# resources exist at rest, so this is inert until a job is submitted.
#
# Requires the KubeRay operator (installed by Terraform, enable_ray = true).
# Values below are normally supplied by ray.defaults.yaml, rendered from
# modules/local_kubernetes/templates/ray.tpl.
ray:
  enabled: false

  # Fail the release, with instructions, if ray.enabled is set on a cluster where
  # the Terraform side has not been applied (no KubeRay operator, no namespace).
  # Without it the chart installs fine and the first submitted job fails instead.
  # Only runs against a real cluster; offline `helm template` skips it.
  preflight: true

  # Route Delta Lake exports through Ray instead of the celery deltalake worker.
  # Server-side: the api decides per deployment, so the wizard offers no choice
  # and clients need no changes.
  #
  # Separate from ray.enabled on purpose. "The platform is installed" and
  # "production exports run on it" are different decisions -- run the operator,
  # namespace and RBAC for a while with exports still on celery, then flip this.
  # Rolling back is this one value, which leaves the platform (and any in-flight
  # job's records) intact. Has no effect unless ray.enabled.
  deltalakeExport: true

  # Not "default": Ray's job submission API has no authentication, so RayJobs are
  # kept out of the shared namespace. Created by Terraform, not by this chart.
  namespace: "ray-jobs"

  # MUST match the ray package installed in the materializationengine image.
  rayVersion: "2.57.0"

  # Dedicated least-privilege Ray service account key -- deliberately not the
  # materialize key. See templates/ray_secret.yaml for why.
  credentialsSecret: ""
  secretFiles:
    - name: google-secret.json
      value: ""
    - name: cave-secret.json
      value: ""

  # Job lifecycle
  shutdownAfterJobFinishes: true
  # Delay before KubeRay deletes the RayCluster -- not CR retention. The RayJob
  # CR survives on its own (operator DELETE_RAYJOB_CR_AFTER_JOB_FINISHES=false),
  # so status polling is unaffected by this. Every second here is a full idle
  # head pod (2 CPU / 8Gi) still billing after the job is done.
  ttlSecondsAfterFinished: 60
  # The only backstop against a wedged job pinning mesh-pool nodes open.
  activeDeadlineSeconds: 86400
  backoffLimit: 1

  # Cap on Ray's on-disk object spill, so a spilling job cannot fill the node.
  spillSizeLimit: "10Gi"

  # Default ceiling on worker pods; the submitter overrides per job.
  maxWorkers: 20

  worker:
    resources:
      requests:
        # Sized so ~4 workers pack onto a t2d-standard-4 mesh-pool node.
        cpu: "1000m"
        memory: "3Gi"

  head:
    resources:
      requests:
        # The driver runs on the head, and deltalake's z-order sort is
        # driver-side, so this is not a bookkeeping-only pod.
        cpu: "2000m"
        memory: "8Gi"
