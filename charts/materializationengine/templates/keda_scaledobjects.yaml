{{- if and .Values.keda.enabled .Values.gmp.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-gcm-auth
spec:
  podIdentity:
    provider: gcp
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-producer-queue
spec:
  minReplicaCount: {{ .Values.materialize.producerMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.producerMaxReplicas }}
  scaleTargetRef:
    name: celery-producer
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Query GMP-mapped Prometheus metric from celery exporter, scoped to this cluster and namespace.
        # 2m window (not 1m): the exporter emits every 30s, GMP scrapes every 30s, and GMP has a
        # ~1-2m ingestion lag, so a trailing [1m] window queried in real time often lands entirely in
        # the not-yet-ingested gap -> avg_over_time returns empty -> `or vector(0)` reads 0 -> flapping.
        query: >-
          avg(avg_over_time(celery_queue_length{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.producerQueueName }}"}[2m])) or vector(0)
        # Target average queue length per Pod
        threshold: "{{ .Values.materialize.producerTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
    # In-flight (received-but-unacknowledged) tasks keep pods alive while a task
    # is still running even though celery_queue_length has dropped to 0 (the task
    # has left the queue). Without this, KEDA scales the pod to zero mid-task and
    # the warm-shutdown restores/redelivers the in-flight message. KEDA takes the
    # max desired replicas across triggers, so this is a floor, not a cap.
    # threshold = pool concurrency (in-flight tasks a single pod can handle).
    # max_over_time (not avg) over a 2m window: this is a presence floor -- keep a pod
    # while there was ANY in-flight work in the window. avg dilutes a single flickering
    # task below 1 (and the 2m window rides over GMP's ingest gap, same as above).
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        query: >-
          avg(max_over_time(celery_inflight_tasks{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.producerQueueName }}"}[2m])) or vector(0)
        threshold: "{{ .Values.materialize.celeryProducerConcurrency | default 1 }}"
      authenticationRef:
        name: keda-gcm-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-consumer-queue
spec:
  minReplicaCount: {{ .Values.materialize.consumerMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.consumerMaxReplicas }}
  scaleTargetRef:
    name: celery-consumer
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Scope to this cluster and namespace to avoid cross-cluster series
        query: >-
          avg(avg_over_time(celery_queue_length{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.consumerQueueName }}"}[2m])) or vector(0)
        threshold: "{{ .Values.materialize.consumerTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
    # In-flight (received-but-unacknowledged) tasks keep pods alive while a task
    # is still running even though celery_queue_length has dropped to 0.
    # KEDA takes the max desired replicas across triggers, so this is a floor.
    # threshold = pool concurrency (in-flight tasks a single pod can handle).
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        query: >-
          avg(max_over_time(celery_inflight_tasks{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.consumerQueueName }}"}[2m])) or vector(0)
        threshold: "{{ .Values.materialize.celeryConsumerConcurrency | default 1 }}"
      authenticationRef:
        name: keda-gcm-auth
{{- if .Values.materialize.deltalakeEnabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-deltalake-queue
spec:
  minReplicaCount: {{ .Values.materialize.deltalakeMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.deltalakeMaxReplicas }}
  scaleTargetRef:
    name: celery-deltalake
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Scope to this cluster and namespace to avoid cross-cluster series
        query: >-
          avg(avg_over_time(celery_queue_length{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.deltalakeQueueName }}"}[2m])) or vector(0)
        threshold: "{{ .Values.materialize.deltalakeTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
    # In-flight (received-but-unacknowledged) tasks keep pods alive while a task
    # is still running even though celery_queue_length has dropped to 0.
    # KEDA takes the max desired replicas across triggers, so this is a floor.
    # threshold = pool concurrency (in-flight tasks a single pod can handle).
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        query: >-
          avg(max_over_time(celery_inflight_tasks{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",queue_name="{{ .Values.materialize.deltalakeQueueName }}"}[2m])) or vector(0)
        threshold: "{{ .Values.materialize.celeryDeltalakeConcurrency | default 1 }}"
      authenticationRef:
        name: keda-gcm-auth
{{- end }}
{{- end }}
