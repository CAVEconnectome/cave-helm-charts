{{- if and .Values.keda.enabled .Values.gmp.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-gcm-auth
spec:
  podIdentity:
    provider: gcp
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-producer-queue
spec:
  minReplicaCount: {{ .Values.materialize.producerMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.producerMaxReplicas }}
  scaleTargetRef:
    name: celery-producer
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Query GMP-mapped Prometheus metric from celery exporter, scoped to this cluster and namespace
        query: >-
          avg(avg_over_time({"__name__"="prometheus.googleapis.com/celery_queue_length/gauge","cluster"="{{ .Values.cluster.cluster }}","namespace"="{{ .Release.Namespace }}","queue_name"="{{ .Values.materialize.producerQueueName }}"}[1m])) or vector(0)
        # Target average queue length per Pod
        threshold: "{{ .Values.materialize.producerTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-consumer-queue
spec:
  minReplicaCount: {{ .Values.materialize.consumerMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.consumerMaxReplicas }}
  scaleTargetRef:
    name: celery-consumer
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Scope to this cluster and namespace to avoid cross-cluster series
        query: >-
          avg(avg_over_time({"__name__"="prometheus.googleapis.com/celery_queue_length/gauge","cluster"="{{ .Values.cluster.cluster }}","namespace"="{{ .Release.Namespace }}","queue_name"="{{ .Values.materialize.consumerQueueName }}"}[1m])) or vector(0)
        threshold: "{{ .Values.materialize.consumerTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
{{- if .Values.materialize.deltalakeEnabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-deltalake-queue
spec:
  minReplicaCount: {{ .Values.materialize.deltalakeMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.deltalakeMaxReplicas }}
  scaleTargetRef:
    name: celery-deltalake
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # Scope to this cluster and namespace to avoid cross-cluster series
        query: >-
          avg(avg_over_time({"__name__"="prometheus.googleapis.com/celery_queue_length/gauge","cluster"="{{ .Values.cluster.cluster }}","namespace"="{{ .Release.Namespace }}","queue_name"="{{ .Values.materialize.deltalakeQueueName }}"}[1m])) or vector(0)
        threshold: "{{ .Values.materialize.deltalakeTargetQueueLength }}"
      authenticationRef:
        name: keda-gcm-auth
{{- end }}
{{- end }}
