apiVersion: v1
kind: Service
metadata:
  name: flower
spec:
  ports:
    - port: 5555
      targetPort: 5555
  selector:
    app: flower
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.standardPool}}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.standardPool}}
      containers:
        - name: flower
          image: mher/flower:0.9.5
          args:
            - flower
            - --broker=redis://{{ .Values.materialize.redis.host}}:{{ .Values.materialize.redis.port}}/0
            - --port=5555
            - --purge_offline_workers=1
          env:
            - name: FLOWER_PORT
              value: "5555"
            # flower's own --conf is tornado options, not celery settings. Celery's
            # settings come from a config module named by CELERY_CONFIG_MODULE, which is
            # exactly what its --config flag sets, so this is the same thing without
            # depending on a flag flower does not document.
            - name: CELERY_CONFIG_MODULE
              value: celeryconfig
            - name: PYTHONPATH
              value: /etc/celery-broker
          volumeMounts:
            - name: celery-broker-config
              mountPath: /etc/celery-broker
          ports:
            - containerPort: 5555
          resources:
            requests:
              memory: 150Mi
              cpu: 10m
      volumes:
        - name: celery-broker-config
          configMap:
            name: celery-broker-config
      restartPolicy: Always