{{- if .Values.gmp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-exporter
  labels:
    app: celery-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-exporter
  template:
    metadata:
      labels:
        app: celery-exporter
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: celery-exporter
          image: {{ .Values.cluster.dockerRegistry}}/celery-metric-exporter:{{ .Values.materialize.celeryExporterTag | default "v8" }}
          command: ["python"]
          args:
            - cli.py
            - --broker-url
            - redis://:{{ .Values.materialize.redis.password}}@{{ .Values.materialize.redis.host}}:{{ .Values.materialize.redis.port}}/0
            - --port
            - "9540"
            # Same value flower gets from the celery-broker-config module. The exporter
            # runs an event receiver, so it holds a consuming kombu channel and can
            # restore unacknowledged messages broker-wide; left on kombu's 3600s default
            # it reclaims long tasks belonging to other workers. Requires v8 or newer.
            - --visibility-timeout
            - "{{ .Values.materialize.celery.visibilityTimeout | default 21600 | int }}"
            - -q
            - {{ .Values.materialize.producerQueueName | default "process" }}
            - -q
            - {{ .Values.materialize.consumerQueueName | default "workflow"}}
{{- if .Values.materialize.deltalakeEnabled }}
            - -q
            - {{ .Values.materialize.deltalakeQueueName | default "deltalake" }}
{{- end }}
            - -q
            - {{ .Values.materialize.orchestrationQueueName | default "orchestration" }}
          ports:
            - name: metrics
              containerPort: 9540
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
{{- end }}
