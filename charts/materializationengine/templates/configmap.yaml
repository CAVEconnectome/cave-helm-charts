{{- $cloudsql_pw := .Values.cloudsql.password | required ".Values.cloudsql.password is required." }}
{{- $redis_host := .Values.materialize.redis.host | required ".Values.materialize.redis.host is required." }}
{{- $global_server := .Values.cluster.globalServer | required ".Values.cluster.globalServer is required." }}
{{- $domain_name := .Values.cluster.domainName | required ".Values.cluster.domainName is required." }}
{{- $health_aligned_volume_name := .Values.annotation.healthAlignedVolumeName | required ".Values.annotation.healthAlignedVolumeName is required." }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: materializationengine-config
data:
  config.cfg: |
    import os
    import json
    import logging
    # Dynamic config generation
    INFOSERVICE_ENDPOINT = "https://{{ .Values.cluster.globalServer }}/info"
    SCHEMA_SERVICE_ENDPOINT = "https://{{ .Values.cluster.globalServer }}/schema/"
    GLOBAL_SERVER_URL = "https://{{ .Values.cluster.globalServer }}"
    LOCAL_SERVER_URL = "https://{{ .Values.cluster.environment | default "local" }}.{{ .Values.cluster.domainName }}"
    TESTING = False
    SQLALCHEMY_DATABASE_URI = "postgres://{{ .Values.cloudsql.username}}:{{ .Values.cloudsql.password}}@127.0.0.1:3306/annotation"
    REDIS_HOST = "{{ .Values.materialize.redis.host}}"
    REDIS_PORT = "{{ .Values.materialize.redis.port}}"
    REDIS_PASSWORD = "{{ .Values.materialize.redis.password}}"
    REDIS_URL = "redis://:{{ .Values.materialize.redis.password}}@{{ .Values.materialize.redis.host}}:{{ .Values.materialize.redis.port}}/0"
    # Add all other configuration options similarly...
    CELERY_BROKER_URL = REDIS_URL
    CELERY_RESULT_BACKEND = CELERY_BROKER_URL
    # Celery reads this old-style name and aliases it onto broker_transport_options,
    # overriding the hardcoded dict in MaterializationEngine's create_celery(). It is a
    # whole-dict REPLACEMENT, not a merge, so socket_timeout/socket_connect_timeout have
    # to be restated here or create_celery's values are lost.
    #
    # visibility_timeout must match every other client on this broker -- flower (via the
    # celery-broker-config module) and the metrics exporter (via --visibility-timeout).
    # The unacked index is global: kombu restores any message older than the visibility
    # timeout of whichever connection notices it, so the broker's effective timeout is the
    # smallest value any client sets. All three come from materialize.celery.visibilityTimeout.
    BROKER_TRANSPORT_OPTIONS = {
        "visibility_timeout": {{ .Values.materialize.celery.visibilityTimeout | default 21600 | int }},
        "socket_timeout": 20,
        "socket_connect_timeout": 20,
    }
    MATERIALIZATION_ROW_CHUNK_SIZE = 500
    TEST_DB_NAME = "{{ .Values.annotation.healthAlignedVolumeName }}"
    INFO_API_VERSION = 2
    DATASTACKS ={{ .Values.materialize.datastacks | toJson}}
    DAYS_TO_EXPIRE = 7
    LTS_DAYS_TO_EXPIRE = 30
    SQL_INSTANCE_NAME = "{{ .Values.cloudsql.sqlInstanceName }}"
    # database number config
    MIN_DATABASES = {{ .Values.materialize.minDatabases | default 1 }}
    MAX_DATABASES = {{ .Values.materialize.maxDatabases | default 3 }}  
    # celery throttling settings
    QUERY_LIMIT_SIZE = {{ .Values.materialize.querylimit | default 500000 }}
    QUEUE_LENGTH_LIMIT = 10000
    QUEUES_TO_THROTTLE = ["process"]
    THROTTLE_QUEUES = True
    MERGE_TABLES = False
    LOGGING_LEVEL = logging.{{ .Values.materialize.loggingLevel | default "ERROR" | upper }}
    if os.environ.get("DAF_CREDENTIALS", None) is not None:
        with open(os.environ.get("DAF_CREDENTIALS"), "r") as f:
            AUTH_TOKEN = json.load(f)["token"]
    else:
        AUTH_TOKEN = ""
    {{ $raw := .Values.materialize.schedules }}
    {{ if kindIs "string" $raw }}
      {{ $s := trim $raw }}
      {{ if or (hasPrefix "[" $s) (hasPrefix "{" $s) }}
    BEAT_SCHEDULES = {{ $s | indent 4 }}
      {{ else }}
    BEAT_SCHEDULES = {{ $s | fromJson | toJson | indent 4 }}
      {{ end }}
    {{ else }}
      {{- /* not a string: render as JSON; if empty list, render [] to satisfy code expecting a list */ -}}
      {{ $isList := kindIs "slice" $raw }}
      {{ if and $isList (empty $raw) }}
    BEAT_SCHEDULES = []
      {{ else }}
    BEAT_SCHEDULES = {{ $raw | toJson | indent 4 }}
      {{ end }}
    {{ end }}
    AUTH_SHARED_EXCLUDED_GROUPS={{ .Values.annotation.excludedPermissionGroups | toJson }}
    DB_CONNECTION_POOL_SIZE = 5 
    DB_CONNECTION_MAX_OVERFLOW = 5
    {{- if .Values.materialize.uploadBucketName }}
    MATERIALIZATION_UPLOAD_BUCKET_PATH = "{{ .Values.materialize.uploadBucketName }}"
    {{- end }}
    {{- if .Values.materialize.dumpBucketPath }}
    MATERIALIZATION_DUMP_BUCKET = "{{ .Values.materialize.dumpBucketPath }}"
    {{- end }}
    {{- if .Values.materialize.deltalakeOutputBucket }}
    DELTALAKE_OUTPUT_BUCKET = "{{ .Values.materialize.deltalakeOutputBucket }}"
    {{- else if .Values.materialize.dumpBucketPath }}
    DELTALAKE_OUTPUT_BUCKET = "{{ .Values.materialize.dumpBucketPath }}/deltalake_exports"
    {{- end }}
    {{- if .Values.materialize.deltalakeFlushThresholdBytes }}
    DELTALAKE_FLUSH_THRESHOLD_BYTES = {{ .Values.materialize.deltalakeFlushThresholdBytes | int64 }}
    {{- end }}
    {{- if .Values.materialize.deltalakeOptimizeTargetSizeBytes }}
    DELTALAKE_OPTIMIZE_TARGET_SIZE_BYTES = {{ .Values.materialize.deltalakeOptimizeTargetSizeBytes | int64 }}
    {{- end }}
    {{- if .Values.materialize.deltalakeOptimizeMaxSpillSizeBytes }}
    DELTALAKE_OPTIMIZE_MAX_SPILL_SIZE_BYTES = {{ .Values.materialize.deltalakeOptimizeMaxSpillSizeBytes | int64 }}
    {{- end }}