{{- if .Values.ray.enabled }}
{{- $ns := .Values.ray.namespace | required ".Values.ray.namespace is required when ray.enabled." -}}
{{/*
Credentials mounted into Ray head and worker pods.

This is deliberately NOT materialize-google-cloud-key. Ray's job submission API
has no authentication of any kind (CVE-2023-48022, which upstream disputes as
intended behaviour), so anything that can reach a Ray head executes arbitrary
Python as the Ray process. The materialize key carries roles/cloudsql.admin and
project-level roles/storage.objectAdmin; mounting it here would turn any
in-cluster foothold into a full credential compromise.

Terraform creates a dedicated ray-* service account scoped to cloudsql.client
plus objectAdmin on the single deltalake bucket, and publishes its key as
ray-google-secret-<prefix>-<workspace>. ray.secretFiles resolves that through
helmfile's ref+gcpsecrets:// at apply time.

Lives in the ray namespace, not the release namespace, because that is where the
pods that mount it run.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: ray-google-cloud-key
  namespace: {{ $ns }}
type: Opaque
{{ $list := .Values.ray.secretFiles | default (list) }}
{{ if not (empty $list) }}
stringData:
  {{ range $list }}
    {{ $v := .value }}
    {{ .name }}: {{ if kindIs "map" $v }}{{ $v | toJson | quote }}{{ else }}{{ $v | quote }}{{ end }}
  {{ end }}
{{ else }}
stringData: {}
{{ end }}
{{- end }}
