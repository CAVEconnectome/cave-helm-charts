{{/*
Celery settings for processes that connect to this redis as a broker but are NOT built
from the materializationengine image -- currently flower, which would otherwise run on
kombu's 3600s default visibility timeout.

Rendered as a celery config MODULE rather than passed on a command line because celery has
no CLI flag for transport options. `celery.bin.base.Command` accepts --config, and all that
does is set CELERY_CONFIG_MODULE (celery/bin/base.py: os.environ['CELERY_CONFIG_MODULE'] =
config), so the deployment sets that env var directly and puts this file on PYTHONPATH.

Deliberately carries only broker_transport_options. flower is also given --broker on its
command line, and a config module wins over it, so anything more here would quietly
override the deployment's own broker settings.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: celery-broker-config
data:
  celeryconfig.py: |
    # Generated by the materializationengine chart from .Values.materialize.celery
    # Do not edit in place; change the chart value so every client stays in agreement.
    broker_transport_options = {
        "visibility_timeout": {{ .Values.materialize.celery.visibilityTimeout | default 21600 | int }},
    }
