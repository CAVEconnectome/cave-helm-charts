{{/*
Memory limit for the api container, derived from its memory REQUEST.

Rationale: the limit and the request must move together. A container with no memory limit does
not fail in isolation when a request over-allocates -- it takes the whole node past its eviction
threshold, so the kubelet evicts the pod and every other in-flight request on it dies, /health
included. But a hand-set absolute limit rots the moment someone retunes the request, and it is
easy to set one so low it crash-loops healthy pods or so high it contains nothing. Expressing it
as a multiple of the request means the only number an operator normally touches is the request.

Precedence: an explicit resources.limits.memory wins; otherwise request * memoryRequestLimitRatio;
set memoryRequestLimitRatio to 0 (or null) to emit no limit at all.

Deliberately defined here rather than in a new templates/_helpers.tpl: `include` creates a
cross-file dependency that fails the entire render with "no template ... associated" if the new
file is missing from a packaged chart, which is precisely what happened when uwsgi_configmap.yaml
was left untracked and `git commit -a` skipped it.

Normalises through bytes and emits Mi, so any valid request unit (Mi, Gi, G, Ki, bare bytes)
yields a valid quantity and 1Gi * 1.5 is 1536Mi rather than being rounded to a useless 2Gi.
*/}}
{{/*
Worker-count view of the api load ladder, with validation.

Three knobs govern how the api handles rising load, and they are written in three different units,
so an inconsistent combination is easy to author and impossible to spot by eye:

  materialize.uwsgi.processes                  a count      (max workers per pod)
  materialize.apiTargetBusyPercent             0-100        (KEDA scale-out target)
  materialize.apiProbes.readyMaxBusyFraction   0-1          (readiness shed point)

This resolves all three to worker counts and fails the render if they do not form a ladder:

  apiTargetWorkers    = floor(apiTargetBusyPercent / 100 * processes)   fleet held here
  readyMaxBusyWorkers = ceil(readyMaxBusyFraction * processes)          pod refuses traffic here

  required:  processes > readyMaxBusyWorkers > apiTargetWorkers

Why each inequality matters:

  processes > readyMaxBusyWorkers -- at least one worker must still be free when a pod begins
    shedding. If they are equal, saturation and shedding coincide and every request arriving during
    the ~20s readiness detection window piles into the listen backlog with nowhere to go.

  readyMaxBusyWorkers > apiTargetWorkers -- replicas must be added before pods refuse. Inverted,
    pods leave the Service while the Deployment is still sized for the old load, concentrating the
    same traffic onto fewer endpoints, which is the opposite of what shedding is for. This ordering
    was actually inverted in 5.26.3-r.3 (shed at 8 of 16, scale-out at 12) and nothing caught it.

ceil() for the shed point is exact, not approximate: health.py compares `busy / total >= fraction`,
so ceil(fraction * processes) is precisely the first integer busy-count that trips it.

Returns "processes,apiTargetWorkers,readyMaxBusyWorkers"; callers splitList on ",".
*/}}
{{- define "materializationengine.apiWorkerLadder" -}}
{{- $u := .Values.materialize.uwsgi | default dict -}}
{{- $probes := .Values.materialize.apiProbes | default dict -}}
{{- /* hasKey, not `default`: `0 | default 16` yields 16, so an explicit processes: 0 would be
       silently replaced by the fallback instead of failing validation. Same falsy-zero trap as
       memoryRequestLimitRatio and startup.enabled. */ -}}
{{- $processes := 16 -}}
{{- if hasKey $u "processes" -}}{{- $processes = int $u.processes -}}{{- end -}}
{{- $pct := float64 (.Values.materialize.apiTargetBusyPercent | default 50) -}}
{{- /* hasKey, not `default`: 0 disables shedding and `default` would swallow that falsy 0. */ -}}
{{- $frac := 0.625 -}}
{{- if hasKey $probes "readyMaxBusyFraction" -}}{{- $frac = float64 $probes.readyMaxBusyFraction -}}{{- end -}}
{{- if lt $processes 1 -}}
{{- fail (printf "materialize.uwsgi.processes must be at least 1, got %d" $processes) -}}
{{- end -}}
{{- $target := int (floor (divf (mulf $pct (float64 $processes)) 100.0)) -}}
{{- $shed := int (ceil (mulf $frac (float64 $processes))) -}}
{{- if gt $frac 0.0 -}}
{{- if ge $shed $processes -}}
{{- fail (printf "api load ladder is invalid: readyMaxBusyFraction %v of %d workers sheds at %d busy, leaving no free worker (need readyMaxBusyWorkers < processes). A pod would saturate and shed at the same moment, so requests arriving during the ~20s readiness detection window have nowhere to go. Lower materialize.apiProbes.readyMaxBusyFraction or raise materialize.uwsgi.processes." $frac $processes $shed) -}}
{{- end -}}
{{- if le $shed $target -}}
{{- fail (printf "api load ladder is invalid: KEDA targets %d busy workers (apiTargetBusyPercent %v%% of %d) but pods shed at %d busy (readyMaxBusyFraction %v). Scale-out must come first, so readyMaxBusyWorkers > apiTargetWorkers; as configured pods would leave the Service before replicas are added, concentrating the same traffic on fewer endpoints. Lower materialize.apiTargetBusyPercent or raise materialize.apiProbes.readyMaxBusyFraction." $target $pct $processes $shed $frac) -}}
{{- end -}}
{{- end -}}
{{- printf "%d,%d,%d" $processes $target $shed -}}
{{- end -}}
{{- define "materializationengine.apiMemoryLimit" -}}
{{- $res := .Values.materialize.resources -}}
{{- $explicit := "" -}}
{{- if $res.limits -}}{{- $explicit = ($res.limits.memory | default "") -}}{{- end -}}
{{- if $explicit -}}
{{- $explicit -}}
{{- else -}}
{{- /* hasKey, not `default`: a ratio of 0 means "no limit" and `default` would silently
       replace that falsy 0 with the fallback -- the same 0-vs-unset trap as dig/default. */ -}}
{{- $ratio := 1.5 -}}
{{- if hasKey $res "memoryRequestLimitRatio" -}}{{- $ratio = $res.memoryRequestLimitRatio -}}{{- end -}}
{{- if $ratio -}}
{{- $req := ($res.requests.memory | default "800Mi" | toString) -}}
{{- $num := regexFind "^[0-9.]+" $req -}}
{{- $unit := regexFind "[A-Za-z]*$" $req -}}
{{- $mult := 1.0 -}}
{{- if eq $unit "Ki" -}}{{- $mult = 1024.0 -}}
{{- else if eq $unit "Mi" -}}{{- $mult = 1048576.0 -}}
{{- else if eq $unit "Gi" -}}{{- $mult = 1073741824.0 -}}
{{- else if eq $unit "Ti" -}}{{- $mult = 1099511627776.0 -}}
{{- else if or (eq $unit "K") (eq $unit "k") -}}{{- $mult = 1000.0 -}}
{{- else if eq $unit "M" -}}{{- $mult = 1000000.0 -}}
{{- else if eq $unit "G" -}}{{- $mult = 1000000000.0 -}}
{{- else if eq $unit "T" -}}{{- $mult = 1000000000000.0 -}}
{{- else if ne $unit "" -}}{{- fail (printf "materialize.resources.requests.memory %q has an unrecognised unit %q" $req $unit) -}}
{{- end -}}
{{- if not $num -}}{{- fail (printf "materialize.resources.requests.memory %q is not a quantity" $req) -}}{{- end -}}
{{- printf "%dMi" (int64 (ceil (divf (mulf (float64 $num) $mult (float64 $ratio)) 1048576.0))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $global_server := .Values.cluster.globalServer | required ".Values.cluster.globalServer is required." }}
{{- $raw := .Values.materialize.tag | default .Values.materialize.version | default .Chart.AppVersion   -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}
{{- $apipool := .Values.materialize.apipool | default .Values.cluster.lightweightPool | required "materialize.apipool or cluster.lightweightPool is required" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materialize
spec:
  selector:
    matchLabels:
      app: materialize
  template:
    metadata:
      labels:
        app: materialize
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/materialize_secret.yaml") . | sha256sum }}
        checksum/cloudsql: {{ include (print $.Template.BasePath "/cloudsql_secret.yaml") . | sha256sum }}
        {{- with (include "materializationengine.uwsgiConfigEffective" .) }}
        # Hash the value directly rather than `include`-ing the ConfigMap template: an include
        # creates a cross-file dependency that fails the whole render with "no template ...
        # associated" if uwsgi_configmap.yaml is missing from a packaged chart (e.g. the new file
        # was left untracked and a commit -a skipped it). Hashing the content is also more precise.
        checksum/uwsgi: {{ . | sha256sum }}
        {{- end }}
    spec:
      # ALWAYS emitted, never conditionally omitted -- "default" is the explicit
      # off state, not an absent field.
      #
      # Omitting it when ray is disabled is a trap: Kubernetes auto-populates the
      # deprecated `serviceAccount` field from `serviceAccountName`, and Helm
      # never renders `serviceAccount`, so it is not in Helm's model and Helm
      # will not remove it. On a rollback that drops `serviceAccountName`, the
      # API server's defaulting puts it straight back from the leftover
      # `serviceAccount`. The field survives the rollback while ray_rbac.yaml
      # stops rendering the ServiceAccount, leaving the Deployment pointing at an
      # identity that no longer exists -- every new ReplicaSet then fails with
      # FailedCreate, the old pods can never be retired, and the release looks
      # applied while running the previous image. That happened on minniev7.
      #
      # Emitting a value in both states keeps the field under Helm's management
      # so it can actually be changed back.
      serviceAccountName: {{ if .Values.ray.enabled }}materialize-ray-submitter{{ else }}default{{ end }}
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ $apipool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ $apipool }}
      volumes:
        - name: materializationengine-config-volume
          configMap:
            name: materializationengine-config
        # Other volumes...
        - name: google-cloud-key
          secret:
            secretName: materialize-google-cloud-key
        - name: cloudsql-instance-credentials-volume
          secret:
            secretName: mat-cloudsql-google-cloud-key
        {{- if (include "materializationengine.uwsgiConfigEffective" .) }}
        - name: uwsgi-config
          configMap:
            name: materialize-uwsgi
        {{- end }}
        {{- if .Values.ray.enabled }}
        - name: rayjob-template
          configMap:
            name: materializationengine-rayjob-template
        {{- end }}
      containers:
        - name: materialize
          image: {{ .Values.cluster.dockerRegistry }}/materializationengine:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 9192
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: materializationengine-config-volume
              mountPath: /app/materializationengine/instance/
            {{- if (include "materializationengine.uwsgiConfigEffective" .) }}
            # subPath: replaces only this file, so the rest of /app (the application code) is
            # untouched. UWSGI_INI already points here, so nothing else needs changing.
            - name: uwsgi-config
              mountPath: /app/uwsgi.ini
              subPath: uwsgi.ini
            {{- end }}
            {{- if .Values.ray.enabled }}
            # Its own directory, not the instance/ dir -- mounting a second
            # ConfigMap over instance/ would shadow config.cfg.
            - name: rayjob-template
              mountPath: /etc/materializationengine/ray
              readOnly: true
            {{- end }}
          env:
            {{- if .Values.ray.enabled }}
            # Wiring for materializationengine/ray/submitter.py. The pod spec
            # itself lives in the mounted template, so nothing about pools,
            # images or secrets is hardcoded in Python.
            - name: RAY_ENABLED
              value: "true"
            # Whether deltalake exports actually route through Ray. Separate from
            # RAY_ENABLED so the platform can be installed while exports stay on
            # celery, and so rolling back is one value rather than a teardown.
            # dig, not `default`: sprig's default treats false as empty, so
            # `false | default true` would silently flip an explicit opt-out
            # back on -- the same falsy trap the README calls out for
            # minReplicas. Absent means true here: turning ray.enabled on and
            # saying nothing else routes exports through it.
            - name: RAY_DELTALAKE_EXPORT
              value: {{ dig "deltalakeExport" true .Values.ray | quote }}
            - name: RAY_JOB_TEMPLATE_PATH
              value: /etc/materializationengine/ray/rayjob-template.yaml
            - name: RAY_JOB_NAMESPACE
              value: {{ .Values.ray.namespace | quote }}
            - name: RAY_JOB_MAX_WORKERS
              value: {{ .Values.ray.maxWorkers | default 20 | quote }}
            {{- end }}
            {{- if (include "materializationengine.uwsgiConfigEffective" .) }}
            {{- $u := .Values.materialize.uwsgi | default dict }}
            # UWSGI_PROCESSES / UWSGI_CHEAPER must be set as ENV VARS, not just in uwsgi.ini.
            #
            # uwsgi applies option sources in order and the last one wins. In this image the order
            # is: UWSGI_INI (=/app/uwsgi.ini, the mounted ConfigMap) -> UWSGI_* env vars ->
            # --ini /etc/uwsgi/uwsgi.ini. The base image bakes ENV UWSGI_PROCESSES=16 and
            # UWSGI_CHEAPER=2, which therefore beat the mounted ini every time.
            #
            # Verified on minniev7 2026-08-19: uwsgi.ini said processes=8 / cheaper=4 while a live
            # pod reported 16 worker slots and a floor of 2 spawned. The cheaper=4 change -- added
            # specifically to stop /health starving behind one busy worker after the 2026-08-17 503
            # outage -- had never taken effect. Emitting them here from the same values keeps the
            # ini honest and makes values.yaml the single source of truth.
            {{- $ladderEnv := splitList "," (include "materializationengine.apiWorkerLadder" .) }}
            - name: UWSGI_PROCESSES
              value: {{ index $ladderEnv 0 | quote }}
            - name: UWSGI_CHEAPER
              value: {{ $u.cheaper | default 4 | quote }}
            {{- end }}
            {{- /* hasKey, not `default`: 0 means "disable busy shedding" and `default` would
                   silently replace that falsy 0 with the fallback. */}}
            {{- $probesCfg := .Values.materialize.apiProbes | default dict }}
            {{- $busyFrac := 0.625 }}
            {{- if hasKey $probesCfg "readyMaxBusyFraction" }}{{ $busyFrac = $probesCfg.readyMaxBusyFraction }}{{ end }}
            {{- $ladder := splitList "," (include "materializationengine.apiWorkerLadder" .) }}
            # Busy fraction at which /health/ready reports NOT ready so traffic drains elsewhere.
            # health.py divides by uwsgi's worker-slot count, which is uwsgi.processes, so the
            # resolved ladder for this release is:
            #   {{ index $ladder 0 }} workers per pod
            #   KEDA holds the fleet at {{ index $ladder 1 }} busy
            #   a pod refuses traffic at {{ index $ladder 2 }} busy ({{ sub (index $ladder 0 | int) (index $ladder 2 | int) }} workers left as buffer)
            # The chart fails to render unless processes > shed > target; see
            # materializationengine.apiWorkerLadder above.
            - name: HEALTH_READY_MAX_BUSY_FRACTION
              value: {{ $busyFrac | quote }}
            {{- /* hasKey, not `default`: `false | default X` returns X, so an explicit
                   enabled: false would be swallowed. Same trap as memoryRequestLimitRatio,
                   startup.enabled and uwsgi.processes. */}}
            {{- $audit := .Values.materialize.memoryAudit | default dict }}
            {{- $auditOn := false }}
            {{- if hasKey $audit "enabled" }}{{ $auditOn = $audit.enabled }}{{ end }}
            # Emitted UNCONDITIONALLY. The application default in config.py is "true", so omitting
            # this when disabled would leave the audit running -- the chart has to state the value
            # either way for its default of off to mean anything.
            - name: MEMORY_AUDIT_ENABLED
              value: {{ $auditOn | quote }}
            {{- if $auditOn }}
            - name: MEMORY_AUDIT_WARN_DELTA_MB
              value: {{ $audit.warnDeltaMb | default 100 | quote }}
            - name: MEMORY_AUDIT_MAX_BODY_BYTES
              value: {{ $audit.maxBodyBytes | default 2097152 | int64 | quote }}
            - name: MEMORY_AUDIT_MAX_FILTER_VALUES
              value: {{ $audit.maxFilterValues | default 8 | quote }}
            {{- end }}
            - name: MATERIALIZATION_ENGINE_SETTINGS
              value: /app/materializationengine/instance/config.cfg
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/google-secret.json
            - name: AUTH_URI
              value: {{ .Values.cluster.globalServer }}/auth
            - name: QUEUE_LENGTH_LIMIT
              value: "5001"
            - name: QUEUES_TO_THROTTLE
              value: process
            - name: THROTTLE_QUEUES
              value: "true"
            - name: LIMITER_CATEGORIES
              value: '{"query":"{{ .Values.materialize.limitsQueryPerMinute}}/minute","fast_query":"{{ .Values.materialize.limitsFastQueryPerMinute}}/minute"}'
            - name: LIMITER_URI
              value: redis://{{ .Values.limiter.redis.host }}/0 
            {{- with .Values.materialize.limitsServiceAccountQueryPerMinute }}
            # Higher ceiling for service-account callers on the endpoint caveclient's
            # live_live_query posts to. Limits bucket per (user id, endpoint), so this leaves
            # every other endpoint's limit for the same identity untouched.
            - name: LIMITER_SERVICE_ACCOUNT_OVERRIDES
              # int64: helmfile round-trips values through JSON, where Go decodes numbers as
              # float64, so a large plain integer such as 200000000 renders as "2e+08" and
              # flask_limiter then fails with `couldn't parse rate limit string '2e+08/minute'` --
              # logged once per request and leaving the endpoint with NO limit at all.
              value: '{"LiveTableQuery":{"query":"{{ int64 . }}/minute"}}'
            {{- end }}
            - name: STICKY_AUTH_URL
              value: {{ .Values.cluster.globalServer }}/sticky_auth
            - name: AUTH_URL
              value: {{ .Values.cluster.globalServer }}/auth
            - name: INFO_URL
              value: {{ .Values.cluster.globalServer }}/info
            - name: DAF_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/cave-secret.json
          resources:
            requests:
              memory: {{ .Values.materialize.resources.requests.memory | default "800Mi" }}
              cpu: {{ .Values.materialize.resources.requests.cpu | default "200m" }}
            {{- with (include "materializationengine.apiMemoryLimit" .) }}
            # Containment, not tuning. Without a memory limit a request that over-allocates does
            # not fail by itself: it takes the whole NODE past its eviction threshold, so the
            # kubelet evicts the pod (or the kernel OOM-killer fires) and every other in-flight
            # request on that pod dies with it, including the /health probe that keeps the pod in
            # the Service. Observed on minniev7 2026-08-18: pods evicted at ~970Mi against a 670Mi
            # request, 8 kernel OOM kills in 3h, and 5 nodes flapping NotReady. With a limit the
            # same runaway is one OOMKilled pod instead of a degraded node.
            #
            # Derived from requests.memory * materialize.resources.memoryRequestLimitRatio so the
            # ceiling tracks the request; the ratio must stay above real steady-state RSS or it
            # will kill healthy pods (measured ~460Mi at 4 uwsgi workers, ~740-970Mi at 8, i.e.
            # ~1.4x a 670Mi request). uwsgi's reload-on-rss / evil-reload-on-rss guards fire
            # before this does and cost only the offending request.
            limits:
              memory: {{ . }}
            {{- end }}
          {{- $probes := .Values.materialize.apiProbes | default dict }}
          {{- $startup := $probes.startup | default dict }}
          {{- /* hasKey, not `default`: `false | default true` yields TRUE, because Go templates
                 treat false as empty. Using default here silently ignored `startup.enabled: false`.
                 Same trap as memoryRequestLimitRatio -- unset must mean "on", false must mean off. */}}
          {{- $startupEnabled := true }}
          {{- if hasKey $startup "enabled" }}{{ $startupEnabled = $startup.enabled }}{{ end }}
          {{- if $startupEnabled }}
          # Gates liveness AND readiness until the app has booted once, so a slow start can never be
          # mistaken for a wedged process. Without this, liveness fires at
          # initialDelaySeconds + failureThreshold*periodSeconds and kills the container mid-boot.
          #
          # Measured on minniev7 2026-08-18: `WSGI app ready in N seconds` had p50 14s when idle but
          # p50 40-45s during a fleet-wide restart, with a tail past 75s -- while liveness (15s delay,
          # 3 x 20s) killed at ~55s. That produced 41 "failed liveness probe, will be restarted"
          # events, 57 restarts across 51 pods, and a CrashLoopBackOff: each kill forced another cold
          # boot, which made the next boot slower, which killed more pods. Node CPU was only 29% p50,
          # so the contention was on Cloud SQL and GCS -- create_app runs db.create_all() and
          # StorageService.configure_cors() -- meaning boot time scales with how many pods start at
          # once, exactly when the fleet is recovering.
          #
          # Budget generously: overshooting only delays detection of a genuinely dead container by
          # this much on FIRST start, while undershooting crash-loops the whole fleet.
          startupProbe:
            httpGet:
              # /health/ready, so startup is only satisfied once the app can actually reach the
              # database -- not merely once it is listening.
              path: {{ $probes.readyPath | default "/health/ready" }}
              port: 80
            periodSeconds: {{ $startup.periodSeconds | default 5 }}
            timeoutSeconds: {{ $startup.timeoutSeconds | default $probes.timeoutSeconds | default 5 }}
            failureThreshold: {{ $startup.failureThreshold | default 36 }}
          {{- end }}
          readinessProbe:
            httpGet:
              # Drains the pod when its uwsgi pool is saturated or the database is unreachable.
              # Draining is cheap and reversible: the pod keeps running and rejoins on recovery.
              path: {{ $probes.readyPath | default "/health/ready" }}
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: {{ $probes.timeoutSeconds | default 5 }}
            # Readiness may run faster than the shared period: its latency is the window in which
            # a saturating pod keeps receiving traffic.
            periodSeconds: {{ ($probes.readiness | default dict).periodSeconds | default $probes.periodSeconds | default 20 }}
            # Kept tight on purpose: readiness is the cheap, correct response to a busy pod --
            # it sheds traffic to healthier replicas and costs nothing, since the pod stays running.
            failureThreshold: {{ ($probes.readiness | default dict).failureThreshold | default 3 }}
          livenessProbe:
            httpGet:
              # /health/live does NO i/o and never fails merely because the pod is busy -- it
              # reports unhealthy only on the corrupted-connection-pool signature, which is the
              # one condition a restart actually fixes. Pointing liveness at the same endpoint as
              # readiness is what restarted 41 merely-busy pods on minniev7 2026-08-18, and would
              # equally have left a pool-corrupted pod draining forever without ever restarting.
              path: {{ $probes.livePath | default "/health/live" }}
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: {{ $probes.timeoutSeconds | default 5 }}
            periodSeconds: {{ ($probes.liveness | default dict).periodSeconds | default $probes.periodSeconds | default 20 }}
            # Deliberately MORE tolerant than readiness. /health shares the uwsgi worker pool with
            # real traffic, so a merely-busy pod fails it -- and the two probes previously had
            # identical thresholds, so they always tripped together and a pod that readiness would
            # have temporarily drained got restarted instead, dumping its in-flight requests.
            # Liveness should only catch a process that is actually wedged.
            failureThreshold: {{ ($probes.liveness | default dict).failureThreshold | default 6 }}
        - name: uwsgi-exporter
          image: caveconnectome/uwsgi-export-workers:v14
          # Exposes the metrics endpoint on 0.0.0.0:9101
          ports:
              - containerPort: 9101
          env:
          # This tells the exporter where to find the uWSGI stats server
          - name: UWSGI_STATS_URL
            value: "http://localhost:9192"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      initContainers:
        - name: sysctl-buddy
          image: alpine:3.4
          command:
            - /bin/sh
            - -c
            - sysctl -w net.core.somaxconn=32768
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              memory: 10Mi
              cpu: 5m
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.23.0
          restartPolicy: Always
          args:
            - "--port=3306"
            - "--credentials-file=/secrets/cloudsql/google-secret.json"
            - "--max-sigterm-delay=3600s"
            - "{{ .Values.cloudsql.projectId | default .Values.cluster.googleProject }}:{{ .Values.cluster.googleRegion}}:{{ .Values.cloudsql.sqlInstanceName }}"
          env:
            - name: CSQL_PROXY_HEALTH_CHECK
              value: "true"
            - name: CSQL_PROXY_HTTP_PORT
              value: "9801"
            - name: CSQL_PROXY_HTTP_ADDRESS
              value: 0.0.0.0
            - name: CSQL_PROXY_QUITQUITQUIT
              value: "true"
            - name: CSQL_PROXY_ADMIN_PORT
              value: "9092"
            - name: CSQL_PROXY_STRUCTURED_LOGS
              value: "true"
          ports:
            - containerPort: 9801
              protocol: TCP
          resources:
            requests:
              memory: 8Mi
              cpu: 10m
          securityContext:
            runAsUser: 2 # non-root user
            allowPrivilegeEscalation: false
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /startup
              port: 9801
              scheme: HTTP
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /liveness
              port: 9801
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 9801
