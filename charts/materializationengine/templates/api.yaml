{{/*
Memory limit for the api container, derived from its memory REQUEST.

Rationale: the limit and the request must move together. A container with no memory limit does
not fail in isolation when a request over-allocates -- it takes the whole node past its eviction
threshold, so the kubelet evicts the pod and every other in-flight request on it dies, /health
included. But a hand-set absolute limit rots the moment someone retunes the request, and it is
easy to set one so low it crash-loops healthy pods or so high it contains nothing. Expressing it
as a multiple of the request means the only number an operator normally touches is the request.

Precedence: an explicit resources.limits.memory wins; otherwise request * memoryRequestLimitRatio;
set memoryRequestLimitRatio to 0 (or null) to emit no limit at all.

Deliberately defined here rather than in a new templates/_helpers.tpl: `include` creates a
cross-file dependency that fails the entire render with "no template ... associated" if the new
file is missing from a packaged chart, which is precisely what happened when uwsgi_configmap.yaml
was left untracked and `git commit -a` skipped it.

Normalises through bytes and emits Mi, so any valid request unit (Mi, Gi, G, Ki, bare bytes)
yields a valid quantity and 1Gi * 1.5 is 1536Mi rather than being rounded to a useless 2Gi.
*/}}
{{- define "materializationengine.apiMemoryLimit" -}}
{{- $res := .Values.materialize.resources -}}
{{- $explicit := "" -}}
{{- if $res.limits -}}{{- $explicit = ($res.limits.memory | default "") -}}{{- end -}}
{{- if $explicit -}}
{{- $explicit -}}
{{- else -}}
{{- /* hasKey, not `default`: a ratio of 0 means "no limit" and `default` would silently
       replace that falsy 0 with the fallback -- the same 0-vs-unset trap as dig/default. */ -}}
{{- $ratio := 1.5 -}}
{{- if hasKey $res "memoryRequestLimitRatio" -}}{{- $ratio = $res.memoryRequestLimitRatio -}}{{- end -}}
{{- if $ratio -}}
{{- $req := ($res.requests.memory | default "800Mi" | toString) -}}
{{- $num := regexFind "^[0-9.]+" $req -}}
{{- $unit := regexFind "[A-Za-z]*$" $req -}}
{{- $mult := 1.0 -}}
{{- if eq $unit "Ki" -}}{{- $mult = 1024.0 -}}
{{- else if eq $unit "Mi" -}}{{- $mult = 1048576.0 -}}
{{- else if eq $unit "Gi" -}}{{- $mult = 1073741824.0 -}}
{{- else if eq $unit "Ti" -}}{{- $mult = 1099511627776.0 -}}
{{- else if or (eq $unit "K") (eq $unit "k") -}}{{- $mult = 1000.0 -}}
{{- else if eq $unit "M" -}}{{- $mult = 1000000.0 -}}
{{- else if eq $unit "G" -}}{{- $mult = 1000000000.0 -}}
{{- else if eq $unit "T" -}}{{- $mult = 1000000000000.0 -}}
{{- else if ne $unit "" -}}{{- fail (printf "materialize.resources.requests.memory %q has an unrecognised unit %q" $req $unit) -}}
{{- end -}}
{{- if not $num -}}{{- fail (printf "materialize.resources.requests.memory %q is not a quantity" $req) -}}{{- end -}}
{{- printf "%dMi" (int64 (ceil (divf (mulf (float64 $num) $mult (float64 $ratio)) 1048576.0))) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $global_server := .Values.cluster.globalServer | required ".Values.cluster.globalServer is required." }}
{{- $raw := .Values.materialize.tag | default .Values.materialize.version | default .Chart.AppVersion   -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}
{{- $apipool := .Values.materialize.apipool | default .Values.cluster.lightweightPool | required "materialize.apipool or cluster.lightweightPool is required" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: materialize
spec:
  selector:
    matchLabels:
      app: materialize
  template:
    metadata:
      labels:
        app: materialize
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/materialize_secret.yaml") . | sha256sum }}
        checksum/cloudsql: {{ include (print $.Template.BasePath "/cloudsql_secret.yaml") . | sha256sum }}
        {{- with (include "materializationengine.uwsgiConfigEffective" .) }}
        # Hash the value directly rather than `include`-ing the ConfigMap template: an include
        # creates a cross-file dependency that fails the whole render with "no template ...
        # associated" if uwsgi_configmap.yaml is missing from a packaged chart (e.g. the new file
        # was left untracked and a commit -a skipped it). Hashing the content is also more precise.
        checksum/uwsgi: {{ . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ $apipool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ $apipool }}
      volumes:
        - name: materializationengine-config-volume
          configMap:
            name: materializationengine-config
        # Other volumes...
        - name: google-cloud-key
          secret:
            secretName: materialize-google-cloud-key
        - name: cloudsql-instance-credentials-volume
          secret:
            secretName: mat-cloudsql-google-cloud-key
        {{- if (include "materializationengine.uwsgiConfigEffective" .) }}
        - name: uwsgi-config
          configMap:
            name: materialize-uwsgi
        {{- end }}
      containers:
        - name: materialize
          image: {{ .Values.cluster.dockerRegistry }}/materializationengine:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 9192
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: materializationengine-config-volume
              mountPath: /app/materializationengine/instance/
            {{- if (include "materializationengine.uwsgiConfigEffective" .) }}
            # subPath: replaces only this file, so the rest of /app (the application code) is
            # untouched. UWSGI_INI already points here, so nothing else needs changing.
            - name: uwsgi-config
              mountPath: /app/uwsgi.ini
              subPath: uwsgi.ini
            {{- end }}
          env:
            - name: MATERIALIZATION_ENGINE_SETTINGS
              value: /app/materializationengine/instance/config.cfg
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/google-secret.json
            - name: AUTH_URI
              value: {{ .Values.cluster.globalServer }}/auth
            - name: QUEUE_LENGTH_LIMIT
              value: "5001"
            - name: QUEUES_TO_THROTTLE
              value: process
            - name: THROTTLE_QUEUES
              value: "true"
            - name: LIMITER_CATEGORIES
              value: '{"query":"{{ .Values.materialize.limitsQueryPerMinute}}/minute","fast_query":"{{ .Values.materialize.limitsFastQueryPerMinute}}/minute"}'
            - name: LIMITER_URI
              value: redis://{{ .Values.limiter.redis.host }}/0 
            {{- with .Values.materialize.limitsServiceAccountQueryPerMinute }}
            # Higher ceiling for service-account callers on the endpoint caveclient's
            # live_live_query posts to. Limits bucket per (user id, endpoint), so this leaves
            # every other endpoint's limit for the same identity untouched.
            - name: LIMITER_SERVICE_ACCOUNT_OVERRIDES
              # int64: helmfile round-trips values through JSON, where Go decodes numbers as
              # float64, so a large plain integer such as 200000000 renders as "2e+08" and
              # flask_limiter then fails with `couldn't parse rate limit string '2e+08/minute'` --
              # logged once per request and leaving the endpoint with NO limit at all.
              value: '{"LiveTableQuery":{"query":"{{ int64 . }}/minute"}}'
            {{- end }}
            - name: STICKY_AUTH_URL
              value: {{ .Values.cluster.globalServer }}/sticky_auth
            - name: AUTH_URL
              value: {{ .Values.cluster.globalServer }}/auth
            - name: INFO_URL
              value: {{ .Values.cluster.globalServer }}/info
            - name: DAF_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/cave-secret.json
          resources:
            requests:
              memory: {{ .Values.materialize.resources.requests.memory | default "800Mi" }}
              cpu: {{ .Values.materialize.resources.requests.cpu | default "200m" }}
            {{- with (include "materializationengine.apiMemoryLimit" .) }}
            # Containment, not tuning. Without a memory limit a request that over-allocates does
            # not fail by itself: it takes the whole NODE past its eviction threshold, so the
            # kubelet evicts the pod (or the kernel OOM-killer fires) and every other in-flight
            # request on that pod dies with it, including the /health probe that keeps the pod in
            # the Service. Observed on minniev7 2026-08-18: pods evicted at ~970Mi against a 670Mi
            # request, 8 kernel OOM kills in 3h, and 5 nodes flapping NotReady. With a limit the
            # same runaway is one OOMKilled pod instead of a degraded node.
            #
            # Derived from requests.memory * materialize.resources.memoryRequestLimitRatio so the
            # ceiling tracks the request; the ratio must stay above real steady-state RSS or it
            # will kill healthy pods (measured ~460Mi at 4 uwsgi workers, ~740-970Mi at 8, i.e.
            # ~1.4x a 670Mi request). uwsgi's reload-on-rss / evil-reload-on-rss guards fire
            # before this does and cost only the offending request.
            limits:
              memory: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: {{ .Values.materialize.apiProbes.timeoutSeconds | default 5 }}
            periodSeconds: {{ .Values.materialize.apiProbes.periodSeconds | default 20 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: {{ .Values.materialize.apiProbes.timeoutSeconds | default 5 }}
            periodSeconds: {{ .Values.materialize.apiProbes.periodSeconds | default 20 }}
        - name: uwsgi-exporter
          image: caveconnectome/uwsgi-export-workers:v14
          # Exposes the metrics endpoint on 0.0.0.0:9101
          ports:
              - containerPort: 9101
          env:
          # This tells the exporter where to find the uWSGI stats server
          - name: UWSGI_STATS_URL
            value: "http://localhost:9192"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      initContainers:
        - name: sysctl-buddy
          image: alpine:3.4
          command:
            - /bin/sh
            - -c
            - sysctl -w net.core.somaxconn=32768
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              memory: 10Mi
              cpu: 5m
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.23.0
          restartPolicy: Always
          args:
            - "--port=3306"
            - "--credentials-file=/secrets/cloudsql/google-secret.json"
            - "--max-sigterm-delay=3600s"
            - "{{ .Values.cluster.googleProject}}:{{ .Values.cluster.googleRegion}}:{{ .Values.cloudsql.sqlInstanceName }}"
          env:
            - name: CSQL_PROXY_HEALTH_CHECK
              value: "true"
            - name: CSQL_PROXY_HTTP_PORT
              value: "9801"
            - name: CSQL_PROXY_HTTP_ADDRESS
              value: 0.0.0.0
            - name: CSQL_PROXY_QUITQUITQUIT
              value: "true"
            - name: CSQL_PROXY_ADMIN_PORT
              value: "9092"
            - name: CSQL_PROXY_STRUCTURED_LOGS
              value: "true"
          ports:
            - containerPort: 9801
              protocol: TCP
          resources:
            requests:
              memory: 8Mi
              cpu: 10m
          securityContext:
            runAsUser: 2 # non-root user
            allowPrivilegeEscalation: false
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /startup
              port: 9801
              scheme: HTTP
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 10
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /liveness
              port: 9801
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 9801
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "curl -f -X POST http://localhost:9092/quitquitquit || kill -15 1"]
          volumeMounts:
            - name: cloudsql-instance-credentials-volume
              mountPath: /secrets/cloudsql
              readOnly: true
