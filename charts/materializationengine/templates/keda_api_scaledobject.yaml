{{- if and .Values.keda.enabled .Values.gmp.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: materialize-api
  annotations:
    validations.keda.sh/hpa-ownership: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: materialize
  minReplicaCount: {{ .Values.materialize.apiMinReplicas }}
  maxReplicaCount: {{ .Values.materialize.apiMaxReplicas }}
  triggers:
    - type: prometheus
      authenticationRef:
        name: keda-gcm-auth
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # GMP uses prometheus_target for scraped Prometheus metrics; scope to cluster/namespace and controller
        query: >-
          avg(avg_over_time({"__name__"="prometheus.googleapis.com/uwsgi_perc_busy_workers/gauge","monitored_resource"="prometheus_target","cluster"="{{ .Values.cluster.cluster }}","namespace"="{{ .Release.Namespace }}","top_level_controller_name"="materialize"}[1m])) or vector(0)
        # Target AverageValue in percent
        threshold: "75"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
{{- end }}
