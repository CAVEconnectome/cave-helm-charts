{{/*
uwsgi.ini for the api container, rendered from values.

Mounted over /app/uwsgi.ini with subPath, which replaces that one file and leaves the rest of /app
(the application code) untouched. UWSGI_INI already points at that path, so no env change is needed.
uwsgi reads the file only at startup, so subPath's lack of live updates costs nothing -- a retune
needs a restart either way, which the checksum annotation on the pod template triggers.

Precedence: materialize.uwsgiConfig, if set, is used verbatim as a WHOLE-FILE replacement and every
materialize.uwsgi.* value is ignored. That escape hatch exists for one-off debugging; the values
below are the supported way to tune this, so a temporary experiment cannot quietly become the
permanent config that nobody can find the source of.

Note /etc/uwsgi/uwsgi.ini is loaded AFTER this file and wins on conflicts, so socket, chmod-socket,
need-app, die-on-term, hook-master-start and show-config cannot be overridden from here. They are
emitted anyway to keep this file a faithful, readable picture of the running config.

These live here, alongside the ConfigMap that carries the file, rather than in api.yaml or a new
_helpers.tpl. api.yaml includes uwsgiConfigEffective to decide whether to mount the volume and to
hash the content into its pod-template checksum, so if this file were ever missing from a packaged
chart the render fails loudly with "no template ... associated" -- which is strictly better than
api.yaml rendering happily and mounting a ConfigMap that was never created.
*/}}
{{- define "materializationengine.uwsgiIni" -}}
{{- $u := .Values.materialize.uwsgi | default dict -}}
{{- $harakiri := $u.harakiri | default 500 | int -}}
{{- $readTimeout := (.Values.materialize.ingress).proxyReadTimeout | default 600 | int -}}
{{- if ge $harakiri $readTimeout -}}
{{- fail (printf "materialize.uwsgi.harakiri (%d) must be BELOW materialize.ingress.proxyReadTimeout (%d). Inverted, nginx abandons the request first and the worker keeps computing a response nobody will read -- observed holding an eighth of a pod for 20 minutes, and harakiri never fired so harakiri-verbose produced no traceback." $harakiri $readTimeout) -}}
{{- end -}}
; GENERATED by the materializationengine chart from materialize.uwsgi.* -- do not edit in place.
; Set materialize.uwsgiConfig to replace this whole file instead.
[uwsgi]

module = {{ $u.module | default "run" }}
callable = {{ $u.callable | default "application" }}
need-app = true
py-autoreload = {{ $u.pyAutoreload | default 1 }}
socket = /tmp/uwsgi.sock
chown-socket = nginx:nginx
chmod-socket = 664
; Graceful shutdown on SIGTERM, see https://github.com/unbit/uwsgi/issues/849#issuecomment-118869386
hook-master-start = unix_signal:15 gracefully_kill_them_all

uid = nginx
gid = nginx

env = HOME=/home/nginx

stats = 0.0.0.0:{{ $u.statsPort | default 9192 }}
stats-http = true

### Worker scaling
; INERT ON ITS OWN -- see the UWSGI_PROCESSES / UWSGI_CHEAPER env vars in api.yaml.
;
; The base image bakes ENV UWSGI_PROCESSES=16 and UWSGI_CHEAPER=2, and uwsgi applies option
; sources in order with LAST WINNING. In production that order is:
;   1. UWSGI_INI=/app/uwsgi.ini  -> this file
;   2. the UWSGI_* environment variables
;   3. --ini /etc/uwsgi/uwsgi.ini (socket/chmod/need-app/die-on-term only)
; so the env vars land AFTER this file and silently beat whatever is written here. Verified
; 2026-08-19: with `processes = 8` and `cheaper = 4` below, a live pod reported 16 worker slots
; and a floor of 2. `cheaper = 4` had been added to stop /health starving behind a single busy
; worker (the 2026-08-17 503 outage) and had never once taken effect.
;
; The chart therefore ALSO emits these two as env vars from the same values, so this file stays a
; truthful description of the running config. Every other option here has no UWSGI_* counterpart
; and does take effect from this file.
;
; Maximum number of workers. Each costs private rss on top of the shared prefork pages, so this is
; the main lever on the pod's memory ceiling -- 16 workers is a very different budget from 8.
processes = {{ index (splitList "," (include "materializationengine.apiWorkerLadder" $)) 0 }}

; https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html#busyness-cheaper-algorithm
cheaper-algo = {{ $u.cheaperAlgo | default "busyness" }}

; Time window for tracking average busyness
cheaper-overload = {{ $u.cheaperOverload | default 20 }}

; Number of idle cycles before stopping a worker
cheaper-busyness-multiplier = {{ $u.cheaperBusynessMultiplier | default 3 }}

; Minimum number of workers. Above 2 so /health does not queue behind a single busy worker: /health
; is served by this same pool, and busyness only adds workers once the average over
; cheaper-overload * cheaper-busyness-multiplier exceeds cheaper-busyness-max. On 2026-08-17 a
; skeleton burst took the api from 12% to 50% busy, under the then-threshold of 60, so it stayed at
; 2 workers with 6 of 8 unspawned; 50% of two workers is one occupied, /health missed its probe
; timeout on both replicas in one period, and the Service dropped to zero endpoints (503 for 3.5m).
cheaper = {{ $u.cheaper | default 4 }}

; Workers spawned at startup; match the floor so a cold pod is not briefly thinner than a warm one.
cheaper-initial = {{ $u.cheaperInitial | default 4 }}

; Workers added at a time once the busyness trigger is crossed. Keep this small on small nodes: a
; step of 4 adds ~280-400Mi in one move, which on an e2-small api pool (1358Mi allocatable, 99%
; already committed by requests) took the node past its eviction threshold and got the pod evicted
; at ~970Mi against a 670Mi request. A smaller step reaches the same ceiling gradually and gives
; cheaper-rss-limit-soft a chance to stop the climb first.
cheaper-step = {{ $u.cheaperStep | default 2 }}

; Busyness percentage at which more workers are spawned.
cheaper-busyness-max = {{ $u.cheaperBusynessMax | default 50 }}

; Start killing workers if busyness falls below this.
cheaper-busyness-min = {{ $u.cheaperBusynessMin | default 20 }}


### Reloads and limitations
; Max socket listen queue length - requires net.somaxconn increase (see the sysctl-buddy init container)
listen = {{ $u.listen | default 128 }}

; Max request header size
buffer-size = {{ $u.bufferSize | default 32768 }}

; Reload worker after serving X requests
max-requests = {{ $u.maxRequests | default 5000 }}

; Grace period for a single worker to reload/shutdown
worker-reload-mercy = {{ $u.workerReloadMercy | default 600 }}

; Grace period for all workers and processes to reload/shutdown
reload-mercy = {{ $u.reloadMercy | default 605 }}

### Memory guards
; The api container's memory limit is derived, not absolute, and the node it runs on may have very
; little headroom. Without these guards a worker that grows does not fail alone -- it pushes the
; node past its eviction threshold and the kubelet evicts the pod (or the kernel OOM-killer fires),
; taking every other in-flight request and the /health probe with it. Measured 2026-08-18: 8 kernel
; OOM kills in 3h (uwsgi x4) and 5 nodes flapping NotReady.
;
; UNIT TRAP, straight from the uwsgi option set: cheaper-rss-limit-soft is in BYTES while
; reload-on-rss and evil-reload-on-rss are in MEGABYTES. Both are expressed in Mi here and
; converted below, so the values file never carries a raw byte count like 6442450944.
;
; Don't spawn new workers once the workers' COMBINED rss passes this. Keep it HIGH -- it is a weak
; guard and a low value does harm.
;
; It sums per-worker rss, so shared prefork pages are counted once per worker, and measurement on
; 2026-08-18 showed that sum runs anywhere from 1.56x to 3.23x the pod's actual rss. It is therefore
; not merely an imprecise pod-level budget, it is close to uncorrelated with one: a pod with 6
; workers summed to 1526Mi while using 472Mi, and a pod with 4 workers summed to 1086Mi while using
; 697Mi. A 1536Mi setting throttled the pod with 400Mi of headroom and left the fatter one free to
; keep spawning -- the opposite of the intent.
;
; The real cap on a pod's memory is `processes` plus the container limit. Use those.
cheaper-rss-limit-soft = {{ mul ($u.cheaperRssLimitSoftMi | default 2500 | int) 1048576 }}
{{- if $u.reloadOnRssMi }}

; Gracefully recycle a worker whose own rss exceeds this, once its current request finishes.
;
; This is the guard that actually fires, so set it close to the observed distribution rather than
; far above it. Profile of live workers on 2026-08-18: baseline 203Mi, p50 248Mi, p90 257Mi, and
; outliers at 309-318Mi. A worker's rss does not fall back after an expensive query -- the pages it
; dirtied stay private to it -- so pod rss ratchets upward with whatever queries happened to land
; there. That, not worker count, is what drove pods to 888-906Mi against an 871Mi limit and produced
; ~475 OOMKills/hour. Recycling the outliers returns those pages; 300Mi catches them while leaving
; the p90 untouched.
reload-on-rss = {{ $u.reloadOnRssMi | int }}
{{- end }}
{{- if $u.evilReloadOnRssMi }}

; Hard backstop: kill a worker at this rss immediately, without waiting for the request to finish.
; This is the actual guard against a single runaway query. reload-on-rss is graceful and cannot
; help here precisely because the offending request never returns. Losing that one request beats
; losing the pod and everything else in flight on it.
evil-reload-on-rss = {{ $u.evilReloadOnRssMi | int }}
{{- end }}

; Kill a stuck request after this many seconds. Must stay BELOW the ingress proxy-read-timeout
; ({{ $readTimeout }}s), which the chart enforces; see the fail() guard in api.yaml.
harakiri = {{ $harakiri }}

### Misc
; Maintain Python thread support
enable-threads = {{ $u.enableThreads | default true }}

; Required for cheaper-rss-limit-soft and reload-on-rss
memory-report = {{ $u.memoryReport | default true }}

; Additional log output for harakiri, including the request each killed worker was serving
harakiri-verbose = {{ $u.harakiriVerbose | default true }}


### Logging
; Filter our own pre-formatted app messages and pass them through
logger = applog stdio
log-route = applog "source":

; Wrap everything that looks like uWSGI in a single JSON+newline
logger = uWSGIlog stdio
log-route = uWSGIlog address space usage
log-route = uWSGIlog uwsgi
; Every logger here is route-filtered, and the harakiri banner plus the traceback harakiri-verbose
; emits match none of the patterns above -- without these routes the traceback harakiri exists to
; obtain is dropped instead of reaching stdout.
log-route = uWSGIlog HARAKIRI
log-route = uWSGIlog Traceback
; PERCENTS ARE DOUBLED ON PURPOSE -- do not "simplify" them to single %.
; uwsgi runs its own MAGIC VARIABLE substitution over the ini before ${strftime:} is ever
; evaluated, and it eats the strftime format: %d becomes the ini's DIRECTORY and %S its
; FILENAME, while %Y %m %H %M expand to nothing. Unescaped, every log line from these pods
; carried the timestamp "--/etc/uwsgi/T::uwsgi.ini.000Z" instead of a date -- observed on
; api6 2026-08-23. Verified with uwsgi's own parser in a pod:
;   print = %Y-%m-%dT%H:%M:%S.000Z    ->  --/tmp/T::t.ini.000Z     (ini was /tmp/t.ini)
;   print = %%Y-%%m-%%dT%%H:%%M:%%S.000Z  ->  %Y-%m-%dT%H:%M:%S.000Z  (correct)
; %% yields a literal % , which is what ${strftime:} needs to see.
log-encoder = json:uWSGIlog {"source":"uWSGI","time":"${strftime:%%Y-%%m-%%dT%%H:%%M:%%S.000Z}","severity":"info","message":"${msg}"}
log-encoder = nl:uWSGIlog
{{- with $u.extraOptions }}

### Extra options (materialize.uwsgi.extraOptions), emitted verbatim
{{ range . }}{{ . }}
{{ end }}
{{- end }}
{{- end -}}

{{/* Effective uwsgi.ini: explicit whole-file override, else the rendered one, else empty. */}}
{{- define "materializationengine.uwsgiConfigEffective" -}}
{{- if .Values.materialize.uwsgiConfig -}}
{{- .Values.materialize.uwsgiConfig -}}
{{- else if (.Values.materialize.uwsgi | default dict).enabled -}}
{{- include "materializationengine.uwsgiIni" . -}}
{{- end -}}
{{- end -}}
{{- $uwsgi := include "materializationengine.uwsgiConfigEffective" . -}}
{{- if $uwsgi }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: materialize-uwsgi
data:
  uwsgi.ini: |
{{ $uwsgi | indent 4 }}
{{- end }}
