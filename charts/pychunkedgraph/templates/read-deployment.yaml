{{- $raw := .Values.pychunkedgraph.tag | default .Values.pychunkedgraph.version | default .Chart.AppVersion -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pychunkedgraph-read
spec:
  selector:
    matchLabels:
      app: pychunkedgraph-read
  template:
    metadata:
      labels:
        app: pychunkedgraph-read
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "read")) }}
        # Restarts the pods when the rendered uwsgi.ini changes. uwsgi reads the file only at
        # startup, so without this a retune sits in the ConfigMap and never reaches a worker.
        # `include` (not the file path) so the hash covers the MERGED defaults+overlay, and so a
        # packaged chart missing uwsgi_configmap.yaml fails the render instead of mounting a
        # ConfigMap that was never created.
        checksum/uwsgi: {{ . | sha256sum }}
        {{- end }}
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.meshPool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.meshPool }}
      volumes:
        - name: google-cloud-key
          secret:
            secretName: pychunkedgraph-google-cloud-key
        - name: pcg-config-volume
          configMap:
            name: pychunkedgraph-config
        {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "read")) }}
        - name: uwsgi-config
          configMap:
            name: pychunkedgraph-read-uwsgi
        {{- end }}
      terminationGracePeriodSeconds: 15
      containers:
        - name: pychunkedgraph
          image: {{ .Values.cluster.dockerRegistry }}/pychunkedgraph:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 9192
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: pcg-config-volume
              mountPath: /app/pychunkedgraph/app/instance/
            {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "read")) }}
            # subPath replaces this one file and leaves the rest of /etc/uwsgi alone. This is the
            # path supervisord passes to `uwsgi --ini`, and that command line is processed last, so
            # it is the copy that decides -- not the identical /app/uwsgi.ini also in the image.
            - name: uwsgi-config
              mountPath: /etc/uwsgi/uwsgi.ini
              subPath: uwsgi.ini
            {{- end }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/home/nginx/.cloudvolume/secrets/google-secret.json"
            {{- include "pcg_env.config" . | nindent 12 }}
            {{- if not (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "read")) }}
            # Only when the chart is NOT managing uwsgi.ini. UWSGI_INI=uwsgi.ini resolves against
            # WORKDIR /app, i.e. the copy `COPY . /app` leaves at /app/uwsgi.ini -- byte-identical to
            # the /etc/uwsgi/uwsgi.ini that supervisord passes to `--ini`, and loaded BEFORE it, so
            # on its own this has always been a no-op.
            #
            # It stops being harmless once the chart mounts a rendered ini: /app/uwsgi.ini is the
            # stale baked file, loads first, and any option the rendered file omits leaks through
            # from it. reloadOnRssMi: 0 would keep the baked reload-on-rss = 768 on read pods alone.
            - name: UWSGI_INI
              value: "{{ .Values.pychunkedgraph.uwsgiReadIni | default "uwsgi.ini"}}"
            {{- end }}
          resources:
            requests:
              # integer Mi (not <float>Gi): a fractional readMemGb like 1.8 -> "1.8Gi" is a
              # fractional number of bytes, which the k8s API flags as invalid.
              memory: {{ mulf .Values.pychunkedgraph.readMemGb 1024 | int }}Mi
              cpu: {{ .Values.pychunkedgraph.readCpuMilli }}m
            limits:
              # Memory limit = readMemLimitRatio (default 1.2) x request. A container that
              # exceeds this is OOM-killed by the kernel -- CONTAINED to this pod, so a
              # runaway request can't cause node-level OOM that evicts neighbor pods.
              # No CPU limit (CPU is compressible; a limit would only throttle).
              # The read VPA runs RequestsAndLimits, so it preserves this ratio as it
              # right-sizes the request.
              memory: {{ mulf .Values.pychunkedgraph.readMemGb (.Values.pychunkedgraph.readMemLimitRatio | default 1.2) 1024 | int }}Mi
          readinessProbe:
            httpGet:
              path: /segmentation
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /segmentation
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
        {{- include "pcg.uwsgiExporter" . | nindent 8 }}
        {{- include "sysctl.config" . | nindent 8 -}}