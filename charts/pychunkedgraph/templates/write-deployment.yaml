{{- $raw := .Values.pychunkedgraph.tag | default .Values.pychunkedgraph.version | default .Chart.AppVersion -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}

--- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pychunkedgraph
spec:
  selector:
    matchLabels:
      app: pychunkedgraph
  template:
    metadata:
      labels:
        app: pychunkedgraph
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "write")) }}
        # Restarts the pods when the rendered uwsgi.ini changes. uwsgi reads the file only at
        # startup, so without this a retune sits in the ConfigMap and never reaches a worker.
        # `include` (not the file path) so the hash covers the MERGED defaults+overlay, and so a
        # packaged chart missing uwsgi_configmap.yaml fails the render instead of mounting a
        # ConfigMap that was never created.
        checksum/uwsgi: {{ . | sha256sum }}
        {{- end }}
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.standardPool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.standardPool }}
      volumes:
        - name: google-cloud-key
          secret:
            secretName: pychunkedgraph-google-cloud-key
        - name: pcg-config-volume
          configMap:
            name: pychunkedgraph-config
        {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "write")) }}
        - name: uwsgi-config
          configMap:
            name: pychunkedgraph-write-uwsgi
        {{- end }}
      terminationGracePeriodSeconds: 605
      containers:
        - name: pychunkedgraph
          image: {{ .Values.cluster.dockerRegistry }}/pychunkedgraph:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 9192
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: pcg-config-volume
              mountPath: /app/pychunkedgraph/app/instance/
            {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "write")) }}
            # subPath replaces this one file and leaves the rest of /etc/uwsgi alone. This is the
            # path supervisord passes to `uwsgi --ini`, and that command line is processed last, so
            # it is the copy that decides -- not the identical /app/uwsgi.ini also in the image.
            - name: uwsgi-config
              mountPath: /etc/uwsgi/uwsgi.ini
              subPath: uwsgi.ini
            {{- end }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/home/nginx/.cloudvolume/secrets/google-secret.json"
            {{- include "pcg_env.config" . | nindent 12 }}
          resources:
            requests:
              # integer Mi (not <float>Gi) so a fractional writeMemGb doesn't produce a
              # fractional-byte quantity that the k8s API flags as invalid.
              memory: {{ mulf (.Values.pychunkedgraph.writeMemGb | default 4) 1024 | int }}Mi
              cpu: {{ .Values.pychunkedgraph.writeCpuMilli | default 1000}}m
            limits:
              # Memory limit = writeMemLimitRatio (default 1.2) x request. Contains OOM to
              # the pod; the write VPA (RequestsAndLimits) preserves this ratio as it scales.
              memory: {{ mulf (.Values.pychunkedgraph.writeMemGb | default 4) (.Values.pychunkedgraph.writeMemLimitRatio | default 1.2) 1024 | int }}Mi
          readinessProbe:
            httpGet:
              path: /segmentation
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /segmentation
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
        {{- include "pcg.uwsgiExporter" . | nindent 8 }}
        {{- include "sysctl.config" . | nindent 8 -}}
