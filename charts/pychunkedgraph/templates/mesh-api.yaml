{{- $raw := .Values.pychunkedgraph.tag | default .Values.pychunkedgraph.version | default .Chart.AppVersion -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}
{{- $meshRequest := .Values.pychunkedgraph.meshMemory | default "200Mi" -}}
{{- /* hasKey, not `default`: `0 | default 1.5` yields 1.5, so an explicit meshMemLimitRatio: 0 --
       the escape hatch back to an unlimited container -- would be silently overridden. */ -}}
{{- $meshRatio := 1.5 -}}
{{- if hasKey .Values.pychunkedgraph "meshMemLimitRatio" -}}{{- $meshRatio = .Values.pychunkedgraph.meshMemLimitRatio -}}{{- end -}}
{{- $meshLimit := include "pcg.memLimit" (dict "request" $meshRequest "ratio" $meshRatio "name" "pychunkedgraph.meshMemory") -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshing
spec:
  # replicas: 1
  selector:
    matchLabels:
      app: meshing
  template:
    metadata:
      labels:
        app: meshing
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "mesh")) }}
        # Restarts the pods when the rendered uwsgi.ini changes. uwsgi reads the file only at
        # startup, so without this a retune sits in the ConfigMap and never reaches a worker.
        # `include` (not the file path) so the hash covers the MERGED defaults+overlay, and so a
        # packaged chart missing uwsgi_configmap.yaml fails the render instead of mounting a
        # ConfigMap that was never created.
        checksum/uwsgi: {{ . | sha256sum }}
        {{- end }}
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.meshPool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.meshPool }}
      volumes:
        - name: google-cloud-key
          secret:
            secretName: pychunkedgraph-google-cloud-key
        - name: meshing-config-volume
          configMap:
            name: pychunkedgraph-config
        {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "mesh")) }}
        - name: uwsgi-config
          configMap:
            name: meshing-uwsgi
        {{- end }}
      terminationGracePeriodSeconds: 65
      containers:
        - name: meshing
          image: {{ .Values.cluster.dockerRegistry }}/pychunkedgraph:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: meshing-config-volume
              mountPath: /app/pychunkedgraph/app/instance/
            {{- if (include "pcg.uwsgiConfigEffective" (dict "root" $ "service" "mesh")) }}
            # subPath replaces this one file and leaves the rest of /etc/uwsgi alone. This is the
            # path supervisord passes to `uwsgi --ini`, and that command line is processed last, so
            # it is the copy that decides -- not the identical /app/uwsgi.ini also in the image.
            - name: uwsgi-config
              mountPath: /etc/uwsgi/uwsgi.ini
              subPath: uwsgi.ini
            {{- end }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/home/nginx/.cloudvolume/secrets/google-secret.json"
            {{- include "pcg_env.config" . | nindent 12 }}
          resources:
            requests:
              memory: {{ $meshRequest }}
              cpu: {{ .Values.pychunkedgraph.meshCpu | default "100m" }}
            {{- if $meshLimit }}
            limits:
              memory: {{ $meshLimit }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /meshing/api/v1
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /meshing/api/v1
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
        {{- include "sysctl.config" . | nindent 8 -}}
