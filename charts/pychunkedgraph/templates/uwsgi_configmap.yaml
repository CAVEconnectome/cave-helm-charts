{{/*
uwsgi.ini for each pcg service container, rendered from values.

PER SERVICE. read / write / mesh each get their own ConfigMap, rendered from uwsgi.defaults with
uwsgi.<service> merged over it. The defaults reproduce the ini baked into the image, so enabling this
is behaviour-preserving; the point of the split is that the three have measurably different worker
profiles (minniev7 2026-08-22, 8 workers each: read 173-220Mi, write 223-453Mi, mesh 223-285Mi) and
so want different memory guards.

Precedence: uwsgi.<service>.configFile, if set, is used verbatim as a WHOLE-FILE replacement for
that service and every other uwsgi.* value is ignored for it. That escape hatch is for one-off
debugging; the values are the supported way to tune this, so a temporary experiment cannot quietly
become the permanent config nobody can find the source of.

These defines live here, alongside the ConfigMaps that carry the files, so a packaged chart missing
this file fails the render loudly with "no template ... associated" rather than having the
Deployments render happily and mount ConfigMaps that were never created.
*/}}

{{/* Merged config for one service: uwsgi.defaults with uwsgi.<service> overlaid. */}}
{{- define "pcg.uwsgiIni" -}}
{{- $root := .root -}}
{{- $svc := .service -}}
{{- $u := $root.Values.pychunkedgraph.uwsgi | default dict -}}
{{- $base := dict
      "module" "run" "callable" "application"
      "processes" 16 "cheaper" 8 "cheaperInitial" 8 "cheaperStep" 8
      "cheaperAlgo" "busyness" "cheaperOverload" 20 "cheaperBusynessMultiplier" 3
      "cheaperBusynessMax" 60 "cheaperBusynessMin" 20
      "listen" 4096 "bufferSize" 65535 "maxRequests" 5000
      "workerReloadMercy" 600 "reloadMercy" 605 "harakiri" 1200
      "cheaperRssLimitSoftMi" 6144 "reloadOnRssMi" 768 "evilReloadOnRssMi" 0
      "enableThreads" true "memoryReport" true "harakiriVerbose" true
      "log4xx" true "log5xx" true "disableLogging" true
      "statsPort" 9191 "statsHttpPort" 9192 "statsInterval" 5 -}}
{{- $c := deepCopy $base -}}
{{- range $k, $v := ($u.defaults | default dict) -}}
{{- $_ := set $c $k $v -}}
{{- end -}}
{{- range $k, $v := (index $u $svc | default dict) -}}
{{- $_ := set $c $k $v -}}
{{- end -}}
; GENERATED by the pychunkedgraph chart from pychunkedgraph.uwsgi.defaults + pychunkedgraph.uwsgi.{{ $svc }}
; -- do not edit in place. Set pychunkedgraph.uwsgi.{{ $svc }}.configFile to replace this whole file.
[uwsgi]
socket = /tmp/uwsgi.sock
chown-socket = nginx:nginx
chmod-socket = 664
; Graceful shutdown on SIGTERM, see https://github.com/unbit/uwsgi/issues/849#issuecomment-118869386
hook-master-start = unix_signal:15 gracefully_kill_them_all

module = {{ $c.module }}
callable = {{ $c.callable }}

uid = nginx
gid = nginx

env = HOME=/home/nginx

; Python venv
if-env = VIRTUAL_ENV
virtualenv = %(_)
endif =

### Worker scaling
; Maximum number of workers. Each costs private rss on top of the shared prefork pages, so together
; with the container memory limit this is the main lever on the pod's memory ceiling.
processes = {{ $c.processes }}

; https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html#busyness-cheaper-algorithm
cheaper-algo = {{ $c.cheaperAlgo }}

; Time window for tracking average busyness
cheaper-overload = {{ $c.cheaperOverload }}

; Number of idle cycles before stopping a worker
cheaper-busyness-multiplier = {{ $c.cheaperBusynessMultiplier }}

; Minimum number of workers, spawned at startup and never reaped below.
cheaper = {{ $c.cheaper }}
cheaper-initial = {{ $c.cheaperInitial }}

; Workers added at a time once the busyness trigger is crossed. Each step commits
; step x per-worker-rss at once, so on a pod whose limit is close to its request a large step can
; cross the limit in a single move.
cheaper-step = {{ $c.cheaperStep }}

; Busyness percentage at which more workers are spawned.
cheaper-busyness-max = {{ $c.cheaperBusynessMax }}

; Start killing workers if busyness falls below this.
cheaper-busyness-min = {{ $c.cheaperBusynessMin }}


### Reloads and limitations
; Max socket listen queue length - requires net.somaxconn increase (see the sysctl-buddy container)
listen = {{ $c.listen }}

; Max request header size
buffer-size = {{ $c.bufferSize }}

; Reload worker after serving X requests
max-requests = {{ $c.maxRequests }}

; Grace period for a single worker to reload/shutdown
worker-reload-mercy = {{ $c.workerReloadMercy }}

; Grace period for all workers and processes to reload/shutdown
reload-mercy = {{ $c.reloadMercy }}

; Kill stuck/unresponsive requests after this many seconds
harakiri = {{ $c.harakiri }}

### Memory guards
; UNIT TRAP, straight from the uwsgi option set: cheaper-rss-limit-soft is in BYTES while
; reload-on-rss and evil-reload-on-rss are in MEGABYTES. All three are expressed in Mi in values and
; converted here, so the values file never carries a raw byte count like 6442450944.
;
; Don't spawn NEW workers once the workers' COMBINED rss passes this. Keep it high -- it is a weak
; guard, because it sums per-worker rss and so counts the shared prefork pages once per worker,
; making the sum run well above the pod's actual rss. The real cap on a pod is `processes` plus the
; container memory limit.
cheaper-rss-limit-soft = {{ mul ($c.cheaperRssLimitSoftMi | int) 1048576 }}
{{- if $c.reloadOnRssMi }}

; Gracefully recycle a worker whose own rss exceeds this, once its current request finishes. A
; worker's rss does not fall back after an expensive request -- the pages it dirtied stay private to
; it -- so pod rss ratchets upward with whatever requests happened to land there. This returns them.
;
; Set it near the observed per-worker distribution or it never fires. Measured on minniev7
; 2026-08-22, 8 workers per pod: read 173-220Mi, write 223-453Mi, mesh 223-285Mi. The 768 baked into
; the image is above every one of those maxima, so it has never recycled a single worker.
reload-on-rss = {{ $c.reloadOnRssMi | int }}
{{- end }}
{{- if $c.evilReloadOnRssMi }}

; Hard backstop: kill a worker at this rss immediately, WITHOUT waiting for the request to finish.
; This is the only guard against a single runaway request, because reload-on-rss is graceful and
; re-checks rss between requests -- it is structurally blind to a request that balloons and never
; returns. Losing that one request beats losing the pod and everything else in flight on it.
evil-reload-on-rss = {{ $c.evilReloadOnRssMi | int }}
{{- end }}

### Misc
; Maintain Python thread support
enable-threads = {{ $c.enableThreads }}

; Required for cheaper-rss-limit-soft, reload-on-rss and evil-reload-on-rss
memory-report = {{ $c.memoryReport }}

; Additional log output for harakiri, including the request each killed worker was serving
harakiri-verbose = {{ $c.harakiriVerbose }}


### Logging
; Filter our properly pre-formated app messages and pass them through
logger = app stdio
log-route = app ^{.*"source":.*}$

; Capture known / most common uWSGI messages
logger = uWSGIdebug stdio
logger = uWSGIwarn stdio

log-route = uWSGIdebug ^{address space usage
log-route = uWSGIwarn \[warn\]

log-encoder = json:uWSGIdebug {"source":"uWSGI","time":"${strftime:%Y-%m-%dT%H:%M:%S.000Z}","severity":"debug","message":"${msg}"}
log-encoder = nl:uWSGIdebug
log-encoder = json:uWSGIwarn {"source":"uWSGI","time":"${strftime:%Y-%m-%dT%H:%M:%S.000Z}","severity":"warning","message":"${msg}"}
log-encoder = nl:uWSGIwarn

; Treat everything else as error message of unknown origin
logger = unknown stdio

; Creating our own "inverse Regex" using negative lookaheads, which makes this
; log-route rather cryptic and slow... Unclear how to get a simple
; "fall-through" behavior for non-matching messages, otherwise.
log-route = unknown ^(?:(?!^{address space usage|\[warn\]|^{.*"source".*}$).)*$

log-encoder = json:unknown {"source":"unknown","time":"${strftime:%Y-%m-%dT%H:%M:%S.000Z}","severity":"error","message":"${msg}"}
log-encoder = nl:unknown

log-4xx = {{ $c.log4xx }}
log-5xx = {{ $c.log5xx }}
disable-logging = {{ $c.disableLogging }}

; stats and stats-http are also passed on supervisord's uwsgi command line, which is processed after
; this file and wins; the uwsgi-exporter sidecar scrapes 127.0.0.1:9192.
stats = 127.0.0.1:{{ $c.statsPort }}
stats-http = 127.0.0.1:{{ $c.statsHttpPort }}
stats-interval = {{ $c.statsInterval }}
{{- with $c.extraOptions }}

### Extra options (pychunkedgraph.uwsgi.{{ $svc }}.extraOptions), emitted verbatim
{{ range . }}{{ . }}
{{ end }}
{{- end }}
{{- end -}}

{{/*
Effective uwsgi.ini for one service: explicit whole-file override, else the rendered one, else empty.
Callers pass (dict "root" $ "service" "read"|"write"|"mesh") and treat an empty result as "the chart
does not manage this service's uwsgi config" -- no ConfigMap, no volume, no mount.
*/}}
{{- define "pcg.uwsgiConfigEffective" -}}
{{- $u := .root.Values.pychunkedgraph.uwsgi | default dict -}}
{{- $svcCfg := index $u .service | default dict -}}
{{- if $svcCfg.configFile -}}
{{- $svcCfg.configFile -}}
{{- else -}}
{{- /* hasKey, not `default`: `false | default true` is true, so an explicit enabled: false would be
       swallowed and the chart would keep managing a config the operator just turned off. */ -}}
{{- $enabled := true -}}
{{- if hasKey $u "enabled" -}}{{- $enabled = $u.enabled -}}{{- end -}}
{{- if $enabled -}}
{{- include "pcg.uwsgiIni" (dict "root" .root "service" .service) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- range $svc, $name := dict "read" "pychunkedgraph-read-uwsgi" "write" "pychunkedgraph-write-uwsgi" "mesh" "meshing-uwsgi" }}
{{- $ini := include "pcg.uwsgiConfigEffective" (dict "root" $ "service" $svc) }}
{{- if $ini }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  uwsgi.ini: |
{{ $ini | indent 4 }}
{{- end }}
{{- end }}
