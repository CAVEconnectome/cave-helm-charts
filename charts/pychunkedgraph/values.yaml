limiter:
  redis:
    host: ""
cluster:
  # required to fill in or choose
  globalServer: ""
  environment: ""
  domainName: ""
  googleProject: ""
  dataProjectName: ""
  googleRegion: "us-east1"
  googleZone: "us-east1-b"
  # likely fine as defaults
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"
  # optional, used to build Pub/Sub subscription names
  cluster_prefix: ""
pychunkedgraph:
  # image tag; defaults to Chart.appVersion if empty; legacy .version still honored in templates
  tag: ""
  # list of graph IDs; can also be a single comma-separated string for backwards-compatibility
  graphIds: []
  secretFiles:
    # need to fill in with path to service account secret file
    - name: google-secret.json
      value: ""
    # need to fill in with path to secret file
    - name: cave-secret.json
      value: ""
    # should add any other secret files you need here
  config: ""
  redis:
    host: ""
    port: 6379
  bigtableInstanceName: "pychunkedgraph"
  # Autoscaling targets for the write/read API tiers (used by KEDA ScaledObjects
  # and the plain-CPU HPA fallback).
  # apiBusyWorkersTarget: target percent of busy uWSGI workers (prometheus trigger)
  # apiCpuTarget: target CPU utilization percent (cpu trigger / HPA)
  apiBusyWorkersTarget: 75
  apiCpuTarget: 110
  writeMinReplicas: 1
  writeMaxReplicas: 3
  writeMemGb: 4
  writeCpuMilli: 500
  # Write pod memory limit = writeMemLimitRatio x request (same scheme as read).
  writeMemLimitRatio: 1.2
  # VerticalPodAutoscaler for pychunkedgraph (non-read/write) pods. writeMemGb/writeCpuMilli
  # act as the floor (minAllowed); the VPA reacts up to these caps if the profile grows.
  writeVpa:
    enabled: true
    maxMemGb: 10
    maxCpuMilli: 2000
  readMinReplicas: 1
  readMaxReplicas: 10
  readMemGb: 1.8
  readCpuMilli: 125
  # Read pod memory limit = readMemLimitRatio x request. Contains OOM to the pod (no
  # node-level eviction of neighbors); the read VPA (RequestsAndLimits) keeps this ratio
  # as it right-sizes the request.
  readMemLimitRatio: 1.2
  # VerticalPodAutoscaler for pychunkedgraph-read; requires the VPA
  # admission controller on the cluster (GKE: vertical pod autoscaling enabled).
  # readMemGb/readCpuMilli above act as the floor (minAllowed).
  readVpa:
    enabled: true
    maxMemGb: 5
    maxCpuMilli: 1500
  meshMinReplicas: 1
  meshMaxReplicas: 3
  # mesh-api pod resource requests (full k8s quantities so small defaults are expressible).
  # Default to the lightweight legacy sizing; raise per-deployment as needed.
  meshMemory: "200Mi"
  meshCpu: "100m"
  # Periodic restart of the meshing Deployment (legacy meshing_pod_recycler CronJob)
  meshPodRecycler:
    enabled: true
    schedule: "@monthly"
    image: "bitnami/kubectl"
  meshWorkerMinReplicas: 0
  meshWorkerMaxReplicas: 10
  # remesh worker (low-priority queue) scaling bounds
  remeshWorkerMinReplicas: 0
  remeshWorkerMaxReplicas: 10
  remeshQueue: 
  # should be enable or left blank
  enableLogs: "enable"
  # should be the name of table you want to log leave_many for
  logsLeavesMany: ""
  limitsFastQueryPerMinute: 1000
  limitsQueryPerMinute: 100

# KEDA-based scaling controls
keda:
  enabled: true
  # enable KEDA scaling for meshworker; when true, HPA is disabled and KEDA ScaledObject is created
  meshWorker:
    # How many messages per worker we target; 1 means aim for ~1 message per active worker
    messagesPerWorker: 1
    # Polling and cooldown periods (seconds)
    pollingSeconds: 30
    cooldownSeconds: 60
  # enable KEDA scaling for remeshworker; when true, HPA is disabled and KEDA ScaledObject is created
  remeshWorker:
    # How many messages per worker we target; 1 means aim for ~1 message per active worker
    messagesPerWorker: 1
    # Polling and cooldown periods (seconds)
    pollingSeconds: 30
    cooldownSeconds: 60
  # Metric lookback window for faster detection
  timeHorizon: "2m"
  # When no series is returned, treat as 0
  valueIfNull: 0

# Google Managed Prometheus (GMP) scraping for uWSGI busy-workers metrics
gmp:
  enabled: true
  scrape:
    interval: 30s
    path: /
    port: 9101