logLevel: "warning"
pool:
gmp:
  enabled: true
  scrape:
    interval: 30s
cluster:
  # required to fill in or choose
  globalServer: ""
  environment: ""
  domainName: ""
  googleProject: ""
  googleRegion: "us-east1"
  googleZone: "us-east1-b"
  # likely fine as defaults
  lightweightPool: "lightweight-pool"
  meshPool: "mesh-pool"
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"

tourguide:
  # image tag; defaults to Chart.appVersion if empty
  tag: ""
  # HPA settings
  minReplicas: 1
  maxReplicas: 10
  cpuTarget: 85
  # App settings
  tmpDir: "/tmp"
  timeout: "30"
  keda:
    enabled: true
    pollingSeconds: 30
    cooldownSeconds: 60
    alignmentPeriod: "60s"
  # Bare Prometheus metric name as scraped by the tourguide-metrics PodMonitoring
  promMetricName: "http_tourguide_active_requests"
  # Target average active requests across pods
  activeRequestsTarget: 50
  busyWorkersTarget: 75