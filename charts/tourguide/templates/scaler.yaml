{{- if .Values.tourguide.keda.enabled }}
{{- if .Values.gmp.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: tourguide-keda-auth
spec:
  podIdentity:
    provider: gcp
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tourguide-scaledobject
  annotations:
    validations.keda.sh/hpa-ownership: "true"
spec:
  scaleTargetRef:
    name: tourguide
  minReplicaCount: {{ .Values.tourguide.minReplicas | default 0 }}
  maxReplicaCount: {{ .Values.tourguide.maxReplicas | default 10 }}
  pollingInterval: {{ .Values.tourguide.keda.pollingSeconds | default 30 }}
  cooldownPeriod: {{ .Values.tourguide.keda.cooldownSeconds | default 60 }}
  triggers:
    {{- if .Values.gmp.enabled }}
    # active-requests scraped via PodMonitoring/GMP (bare metric name); only when gmp is enabled.
    - type: prometheus
      authenticationRef:
        name: tourguide-keda-auth
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject | required "cluster.googleProject required" }}/location/global/prometheus
        query: >-
          avg(avg_over_time({{ .Values.tourguide.keda.promMetricName | default "http_tourguide_active_requests" }}{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",top_level_controller_name="tourguide"}[{{ .Values.tourguide.keda.alignmentPeriod | default "60s" }}])) or vector(0)
        threshold: "{{ .Values.tourguide.keda.activeRequestsTarget | default 50 }}"
    {{- end }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.tourguide.cpuTarget | default 85 }}"
        containerName: tourguide
{{- else }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tourguide-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tourguide
  minReplicas: {{ max 1 (.Values.tourguide.minReplicas | default 1 | int) }}
  maxReplicas: {{ .Values.tourguide.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tourguide.cpuTarget | default 85 }}
{{- end }}
