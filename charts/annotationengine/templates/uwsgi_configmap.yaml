{{/*
uwsgi.ini for the annotationengine container, rendered from values (the materializationengine
chart's framework, see its uwsgi_configmap.yaml).

Mounted over /app/uwsgi.ini with subPath, which replaces that one file and leaves the rest of /app
(the application code) untouched. UWSGI_INI already points at that path, so no env change is needed.
uwsgi reads the file only at startup; the checksum annotation on the pod template restarts pods
when it changes.

Precedence: annotation.uwsgiConfig, if set, is used verbatim as a WHOLE-FILE replacement and every
annotation.uwsgi.* value is ignored. That escape hatch is for one-off debugging; the values are the
supported way to tune this.

/etc/uwsgi/uwsgi.ini is loaded AFTER this file and wins on conflicts, so socket, chmod-socket,
need-app, die-on-term, hook-master-start and show-config cannot be overridden from here. They are
emitted anyway to keep this file a faithful picture of the running config.

The defaults reproduce what the annotationengine image ran before the chart owned this file: its
own /app/uwsgi.ini, with processes/cheaper as the base image's UWSGI_PROCESSES=16 / UWSGI_CHEAPER=2
env vars made them. The one addition is the stats server the uwsgi-exporter sidecar reads.
*/}}
{{- define "annotationengine.uwsgiIni" -}}
{{- $u := .Values.annotation.uwsgi | default dict -}}
{{- $harakiri := $u.harakiri | default 590 | int -}}
{{- $readTimeout := (.Values.annotation.ingress).proxyReadTimeout | default 600 | int -}}
{{- if ge $harakiri $readTimeout -}}
{{- fail (printf "annotation.uwsgi.harakiri (%d) must be BELOW annotation.ingress.proxyReadTimeout (%d). Inverted, nginx abandons the request first and the worker keeps computing a response nobody will read, and harakiri never fires." $harakiri $readTimeout) -}}
{{- end -}}
{{- /* hasKey, not `default`: `0 | default 16` would silently replace an explicit 0. */ -}}
{{- $processes := 16 -}}
{{- if hasKey $u "processes" -}}{{- $processes = int $u.processes -}}{{- end -}}
{{- if lt $processes 1 -}}
{{- fail (printf "annotation.uwsgi.processes must be at least 1, got %d" $processes) -}}
{{- end -}}
; GENERATED by the annotationengine chart from annotation.uwsgi.* -- do not edit in place.
; Set annotation.uwsgiConfig to replace this whole file instead.
[uwsgi]

module = {{ $u.module | default "run" }}
callable = {{ $u.callable | default "application" }}
need-app = true
socket = /tmp/uwsgi.sock
chown-socket = nginx:nginx
chmod-socket = 664
; Graceful shutdown on SIGTERM, see https://github.com/unbit/uwsgi/issues/849#issuecomment-118869386
hook-master-start = unix_signal:15 gracefully_kill_them_all

uid = nginx
gid = nginx

master = true
vacuum = true
auto-procname = true
die-on-term = true
env = HOME=/home/nginx

; Read by the uwsgi-exporter sidecar (uwsgi_perc_busy_workers, which KEDA scales on)
stats = 0.0.0.0:{{ $u.statsPort | default 9192 }}
stats-http = true

### Worker scaling
; processes and cheaper are ALSO emitted as UWSGI_PROCESSES / UWSGI_CHEAPER env vars (api.yaml):
; the base image bakes ENV UWSGI_PROCESSES=16 and UWSGI_CHEAPER=2, and env vars are applied after
; this file, so without that they would silently beat what is written here.
processes = {{ $processes }}
cheaper = {{ $u.cheaper | default 2 }}
{{- with $u.cheaperAlgo }}

; https://uwsgi-docs.readthedocs.io/en/latest/Cheaper.html#busyness-cheaper-algorithm
cheaper-algo = {{ . }}
cheaper-overload = {{ $u.cheaperOverload | default 20 }}
cheaper-busyness-multiplier = {{ $u.cheaperBusynessMultiplier | default 3 }}
cheaper-busyness-max = {{ $u.cheaperBusynessMax | default 50 }}
cheaper-busyness-min = {{ $u.cheaperBusynessMin | default 20 }}
{{- end }}
{{- with $u.cheaperInitial }}
cheaper-initial = {{ . }}
{{- end }}
{{- with $u.cheaperStep }}
cheaper-step = {{ . }}
{{- end }}

### Reloads and limitations
; Max socket listen queue length - requires net.somaxconn increase (see the sysctl-buddy container)
listen = {{ $u.listen | default 128 }}
buffer-size = {{ $u.bufferSize | default 32768 }}
; Reload a worker after serving this many requests, or after this many seconds
max-requests = {{ $u.maxRequests | default 2048 }}
{{- with $u.maxWorkerLifetime }}
max-worker-lifetime = {{ . }}
{{- end }}
worker-reload-mercy = {{ $u.workerReloadMercy | default 600 }}
reload-mercy = {{ $u.reloadMercy | default 600 }}
mule-reload-mercy = {{ $u.muleReloadMercy | default 600 }}
http-timeout = {{ $u.httpTimeout | default 600 }}
socket-timeout = {{ $u.socketTimeout | default 600 }}

### Memory guards (all in Mi; cheaper-rss-limit-soft is bytes in uwsgi, converted here)
{{- with $u.reloadOnRssMi }}
; Gracefully recycle a worker whose own rss exceeds this, once its current request finishes.
reload-on-rss = {{ . | int }}
{{- end }}
{{- with $u.evilReloadOnRssMi }}
; Kill a worker at this rss immediately, mid-request (guard against a runaway query).
evil-reload-on-rss = {{ . | int }}
{{- end }}
{{- with $u.cheaperRssLimitSoftMi }}
; Stop spawning workers once their COMBINED rss passes this (a weak guard; keep it high).
cheaper-rss-limit-soft = {{ mul (. | int) 1048576 }}
{{- end }}
{{- if or $u.reloadOnRssMi $u.evilReloadOnRssMi $u.cheaperRssLimitSoftMi }}
memory-report = true
{{- end }}

; Kill a stuck request after this many seconds; kept BELOW the ingress proxy-read-timeout
; ({{ $readTimeout }}s), which the chart enforces.
harakiri = {{ $harakiri }}
{{- if $u.harakiriVerbose }}
harakiri-verbose = true
{{- end }}

enable-threads = {{ $u.enableThreads | default true }}
{{- with $u.extraOptions }}

### Extra options (annotation.uwsgi.extraOptions), emitted verbatim
{{ range . }}{{ . }}
{{ end }}
{{- end }}
{{- end -}}

{{/* Effective uwsgi.ini: explicit whole-file override, else the rendered one, else empty. */}}
{{- define "annotationengine.uwsgiConfigEffective" -}}
{{- if .Values.annotation.uwsgiConfig -}}
{{- .Values.annotation.uwsgiConfig -}}
{{- else if (.Values.annotation.uwsgi | default dict).enabled -}}
{{- include "annotationengine.uwsgiIni" . -}}
{{- end -}}
{{- end -}}
{{- $uwsgi := include "annotationengine.uwsgiConfigEffective" . -}}
{{- if $uwsgi }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: annotationengine-uwsgi
data:
  uwsgi.ini: |
{{ $uwsgi | indent 4 }}
{{- end }}
