{{- $raw := .Values.annotation.tag | default .Values.annotation.version | default .Chart.AppVersion -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotationengine
spec:
  selector:
    matchLabels:
      app: annotationengine
  template:
    metadata:
      labels:
        app: annotationengine
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/annotation_secret.yaml") . | sha256sum }}
        checksum/cloudsql: {{ include (print $.Template.BasePath "/cloudsql_secret.yaml") . | sha256sum }}
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.standardPool}}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.standardPool}}
      volumes:
        - name: annotation-engine-config-volume
          configMap:
            name: annotationengine-config
        - name: google-cloud-key
          secret:
            secretName: annengine-google-cloud-key
        - name: cloudsql-instance-credentials-volume
          secret:
            secretName: ann-cloudsql-google-cloud-key
      containers:
        - name: annotationengine
          image: {{ .Values.cluster.dockerRegistry}}/annotationengine:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
            - name: annotation-engine-config-volume
              mountPath: /app/annotationengine/instance/
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/google-secret.json
            - name: LIMITER_CATEGORIES
              value: {{ if .Values.annotation.limiterCategories }}{{ .Values.annotation.limiterCategories | squote }}{{ else }}{{- $cat := dict -}}{{- range $k, $v := .Values.annotation.limits }}{{- $_ := set $cat $k (printf "%v/minute" $v) -}}{{- end -}}{{ toJson $cat | squote }}{{ end }}
            - name: LIMITER_URI
              value: redis://{{ .Values.limiter.redis.host }}/0
            - name: AUTH_URI
              value: {{ .Values.cluster.globalServer }}/auth
            - name: STICKY_AUTH_URL
              value: {{ .Values.cluster.globalServer }}/sticky_auth
            - name: AUTH_URL
              value: {{ .Values.cluster.globalServer }}/auth
            - name: INFO_URL
              value: {{ .Values.cluster.globalServer }}/info
            - name: DAF_CREDENTIALS
              value: /home/nginx/.cloudvolume/secrets/cave-secret.json
            {{- if .Values.gmp.enabled }}
            # uWSGI stats server for the uwsgi-exporter sidecar. The image's uwsgi.ini has
            # none, so turn it on here (uwsgi reads any option from UWSGI_<OPTION>).
            - name: UWSGI_STATS
              value: "0.0.0.0:{{ .Values.annotation.uwsgiStatsPort | default 9192 }}"
            - name: UWSGI_STATS_HTTP
              value: "true"
            {{- end }}
          resources:
            requests:
              memory: 300Mi
              cpu: 100m
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
        {{- if .Values.gmp.enabled }}
        # Exports uwsgi_perc_busy_workers for GMP (see podmonitor.yaml), which the KEDA
        # ScaledObject in scaler.yaml scales on.
        - name: uwsgi-exporter
          image: caveconnectome/uwsgi-export-workers:v14
          ports:
            - containerPort: {{ .Values.gmp.scrape.port | default 9101 }}
          env:
            - name: UWSGI_STATS_URL
              value: "http://localhost:{{ .Values.annotation.uwsgiStatsPort | default 9192 }}"
          # cpu request required: KEDA's cpu trigger needs every container in the
          # pod to declare a cpu request.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
        {{- end }}
        - name: cloudsql-proxy
          image: gcr.io/cloudsql-docker/gce-proxy:1.33.6
          command:
            [
              "/cloud_sql_proxy",
              "-instances={{ .Values.cloudsql.projectId | default .Values.cluster.googleProject }}:{{ .Values.cluster.googleRegion}}:{{ .Values.cloudsql.sqlInstanceName}}=tcp:3306",
              "-credential_file=/secrets/cloudsql/google-secret.json",
            ]
          resources:
            requests:
              memory: 8Mi
              cpu: 10m
          securityContext:
            runAsUser: 2 # non-root user
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: cloudsql-instance-credentials-volume
              mountPath: /secrets/cloudsql
              readOnly: true
        - name: sysctl-buddy
          image: alpine:3.4
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                sysctl -w net.core.somaxconn=32768
                sysctl -w net.ipv4.ip_local_port_range='1024 65535'
                sleep 10
              done
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              memory: 10Mi
              cpu: 5m