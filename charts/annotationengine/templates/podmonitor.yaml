{{- if .Values.gmp.enabled }}
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: annotationengine-uwsgi
  labels:
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app: annotationengine
  endpoints:
    - port: {{ .Values.gmp.scrape.port | default 9101 }}
      interval: {{ .Values.gmp.scrape.interval | default "30s" }}
      path: {{ .Values.gmp.scrape.path | default "/" }}
{{- end }}
