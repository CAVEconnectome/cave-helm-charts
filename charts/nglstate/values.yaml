cluster: {}
redis:
  host: ""
nglstate:
  # Max request body ingress-nginx will accept for this service (nginx default is 1m).
  ingress:
    proxyBodySize: "10m"
  # tag: ""
  replicas: 1
  nglstateServiceAccountSecret: ""
  googleSecretFilename: google-secret.json
  jsonDbTableName: "ngl_state"
  bucketPath: ""
  resources:
    requests:
      memory: 130Mi
      cpu: 50m
  env: {}
