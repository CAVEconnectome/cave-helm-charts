cluster:
  # supplied at deploy time by cluster.yaml; defaults here are for self-documentation
  globalServer: ""
  domainName: ""
  cluster_prefix: ""
  dns_entries: []
  standardPool: "standard-pool"
  dockerRegistry: "docker.io/caveconnectome"

landingpage:
  image: nginx:stable
  # Fixed ConfigMap name (don't change between releases)
  configName: landingpage-config
  replicas: 1
  title: "CAVE services"
  heading: "Services running on this deployment"
  subheading: ""
  # Default set of CAVE services. `url` is a relative path so links work on every
  # hostname the deployment serves; `docs` is optional. Override per-environment
  # (e.g. to trim services a deployment doesn't run, or point docs elsewhere).
  services:
    - name: "Materialization"
      url: "/materialize"
      description: "Materialized annotation tables and versioned spatial queries."
      docs: "https://caveconnectome.github.io/"
    - name: "Annotation"
      url: "/annotation"
      description: "Create and manage spatial annotation tables."
      docs: "https://caveconnectome.github.io/"
    - name: "Segmentation (PyChunkedGraph)"
      url: "/segmentation"
      description: "Proofreadable segmentation graph: splits, merges, root IDs."
      docs: "https://caveconnectome.github.io/"
    - name: "Meshing"
      url: "/meshing"
      description: "On-demand mesh generation for segmented objects."
    - name: "L2 Cache"
      url: "/l2cache"
      description: "Level-2 chunk cache for the segmentation graph."
    - name: "Skeleton Cache"
      url: "/skeletoncache"
      description: "Cached skeletons for segmented cells."
    - name: "Dash"
      url: "/dash"
      description: "Interactive dashboards and analysis apps."
    - name: "TourGuide"
      url: "/tourguide"
      description: "Guided Neuroglancer tours and suggested cells."
