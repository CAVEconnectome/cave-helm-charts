cluster:
  dockerRegistry: docker.io/caveconnectome
  globalServer: ""
  dns_entries: []
  meshPool: mesh-pool
  cluster_prefix: ""

skeletoncache:
  tag: ""
  # Per-endpoint rate limits (requests per minute).
  # Units: per-minute. The chart renders these as "<N>/minute" for LIMITER_CATEGORIES.
  api:
    enabled: true
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      cpuTarget: 80
    # Target percent of busy uWSGI workers for the KEDA prometheus trigger
    # (used only when keda.enabled and gmp.enabled).
    busyWorkersTarget: 75
    # HPA scale-down stabilization (k8s default 300s); lowered so the api fleet
    # drains faster after a burst.
    scaleDownStabilizationSeconds: 90
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
  worker:
    minReplicas: 1
    maxReplicas: 50
    scaleDownStabilizationSeconds: 120
    resources:
      requests:
        memory: 1000Mi
        cpu: 200m
    # VerticalPodAutoscaler for the worker (legacy skeleton-worker-vpa)
    vpa:
      enabled: true
      updateMode: "Auto"
      minCpu: "50m"
      minMemory: "200Mi"
      maxCpu: "1000m"
      maxMemory: "2Gi"
  limiter:
    uri: ""
    categories:
      get_refusal_list: 100
      query_cache: 100
      skeleton_exists: 100
      get_skeleton_that_exists: 1000
      get_skeleton_that_doesnt_exist: 10
      get_skeleton_via_msg_that_exists: 1000
      get_skeleton_via_msg_that_doesnt_exist: 10
      get_skeletons_bulk: 10
      get_skeletons_bulk_async: 10
  # Public-facing datastack name remapping (SKELETON_DATASTACK_NAME_REMAPPING).
  # Set entries here as normal key/value pairs; the chart converts them to a JSON string.
  datastackRemapping: {}
  # Raw string override; when set, used as-is instead of datastackRemapping.
  datastackRemap: ""
  cacheNonH5: "false"
  verboseLevel: "0"
  # Archive one row per generated skeleton to skeletonization_times_v2.csv. Off by default: the
  # service rewrites that whole object on every skeleton, so the cost grows with the number of
  # skeletons ever produced and all workers contend for the same key. Only enable if you have
  # accepted that cost or the write has been resharded.
  archiveSkeletonizationTimes: false
  # Emit one PHASE_TIMINGS line per message (preamble step timings) and one MESSAGE_TIMING line
  # (whole-message wall time). Diagnostic only -- one extra log line per message. Use when
  # throughput does not match the generation times, since the preamble runs on every message
  # including cache hits.
  logPhaseTimings: false
  # Default debug root id; set to a non-zero root ID to enable targeted debugging
  debugRootId: "0"
  queues:
    high: ""
    low: ""
  # Required: Pub/Sub subscription names (no defaults provided)
  high: ""
  low: ""
  deadLetter: ""
  exchanges:
    high: ""
    low: ""
  bigtable:
    instance: ""
  # One-shot integration-test Job (legacy skeletoncache_integrationtests_only.yml).
  # Disabled by default; enable + fill server/datastack to run after a deploy.
  integrationTester:
    enabled: false
    server: ""            # e.g. https://minniev7.microns-daf.com
    datastack: ""         # test datastack definition dict (SKELETON_INTEGRATION_TEST_DATASTACK__*)
    verboseLevel: "2"
    devSlackWebhookId: ""
    prodSlackWebhookId: ""
    resources:
      requests:
        memory: 500Mi
        cpu: 50m
  # Optional: full gs:// cloud path (bucket and optional prefix)
  cloudPath: ""
  # Daily re-attempt of root ids on the skeletonization refusal list. Pub/Sub redelivery
  # handles minutes-to-hours; this handles the case where a long downstream outage
  # exhausted those attempts and left a perfectly good root permanently refused.
  # maxRetryCount bounds it so a genuinely unskeletonizable root is eventually left alone.
  refusalRetry:
    enabled: false
    schedule: "0 17 * * *"   # daily, 17:00 UTC (10:00 PDT) -- off-peak
    maxRetryCount: 7          # a week of daily sweeps per root
    limit: 25                 # roots re-queued per sweep, oldest first
    activeDeadlineSeconds: 900
    dryRun: false
  # Optional secret files rendered into a Kubernetes Secret for mounting
  # Each entry is a name and value; value can be a string or a ref+gcpsecrets:// URI
  secretFiles:
    - name: google-secret.json
      value: ""
    - name: cave-secret.json
      value: ""
  statsExporter:
    enabled: false
    pollSeconds: 30

keda:
  enabled: true
  pollingSeconds: 15
  cooldownSeconds: 600
  activationValue: 0
  # gcp-pubsub (num_undelivered_messages) is emitted ~every 60s with ingestion delay, so a
  # 1m query window frequently lands in the gap and returns empty -> KEDA reads valueIfNull(0)
  # and won't scale up despite a real backlog. Keep >= 2m (matches pcgl2cache). Raise to 3-5m
  # if intermittent misses persist, at the cost of slower reaction/scale-down.
  timeHorizon: "2m"
  valueIfNull: 0
  pubsub:
    messagesPerWorker: 3

gmp:
  enabled: false
  scrape:
    interval: 30s
