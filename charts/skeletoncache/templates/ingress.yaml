{{- if .Values.cluster.dns_entries }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skeletoncache
  annotations:
    kubernetes.io/ingress.class: nginx
    # ingress-nginx defaults client_max_body_size to 1m, and over the cap the INGRESS
    # returns its own nginx 413 before the request reaches the app -- nothing is logged
    # app-side, so the failure is expensive to trace. Tune via skeletoncache.ingress.proxyBodySize.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ (.Values.skeletoncache.ingress).proxyBodySize | default "10m" | quote }}
spec:
  rules:
  {{- range $host := .Values.cluster.dns_entries }}
    - host: {{ $host }}
      http:
        paths:
          - path: /skeletoncache
            pathType: ImplementationSpecific
            backend:
              service:
                name: skeletoncache
                port:
                  number: 80
  {{- end }}
{{- end }}
