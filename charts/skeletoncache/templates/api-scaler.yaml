{{- if .Values.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: skeletoncache-api
  annotations:
    validations.keda.sh/hpa-ownership: "true"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skeletoncache
  minReplicaCount: {{ .Values.skeletoncache.api.hpa.minReplicas }}
  maxReplicaCount: {{ .Values.skeletoncache.api.hpa.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Scale the api fleet down faster after a burst (k8s HPA default is 300s).
          stabilizationWindowSeconds: {{ .Values.skeletoncache.api.scaleDownStabilizationSeconds | default 90 }}
  triggers:
    {{- if .Values.gmp.enabled }}
    # busy-workers % via GMP; only present when gmp is enabled.
    - type: prometheus
      authenticationRef:
        name: skeletoncache-keda-auth
      metadata:
        serverAddress: https://monitoring.googleapis.com/v1/projects/{{ .Values.cluster.googleProject }}/location/global/prometheus
        # sum() not avg(): uwsgi_perc_busy_workers is a per-pod 0-100 ratio under a KEDA
        # AverageValue target (HPA divides the reported value by pod count). avg() caps desired
        # at ceil(100/threshold) (~2 pods) -> inert. sum() -> desired = ceil(replicas*meanBusy%/threshold),
        # scaling the fleet to hold average busy-% at threshold. 2m rides over GMP's ingest lag.
        query: >-
          sum(avg_over_time(uwsgi_perc_busy_workers{cluster="{{ .Values.cluster.cluster }}",namespace="{{ .Release.Namespace }}",top_level_controller_name="skeletoncache"}[2m])) or vector(0)
        threshold: {{ .Values.skeletoncache.api.busyWorkersTarget | quote }}
    {{- end }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.skeletoncache.api.hpa.cpuTarget | quote }}
{{- end }}
