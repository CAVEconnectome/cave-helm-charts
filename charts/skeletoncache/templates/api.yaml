{{- $raw := .Values.skeletoncache.tag | default .Chart.AppVersion -}}
{{- $tag := ternary $raw (printf "v%s" $raw) (hasPrefix "v" $raw) -}}
{{- $categories := .Values.skeletoncache.limiter.categories | default .Values.skeletoncache.limits -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skeletoncache
spec:
  selector:
    matchLabels:
      app: skeletoncache
  template:
    metadata:
      labels:
        app: skeletoncache
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
    spec:
      tolerations:
        - key: "pool"
          operator: "Equal"
          value: "{{ .Values.cluster.meshPool }}"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.cluster.meshPool }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: skeletoncache
          image: {{ .Values.cluster.dockerRegistry }}/skeletoncache:{{ $tag }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
            # This image's uwsgi serves its stats HTTP server on 127.0.0.1:1717
            # (the fleet default elsewhere is 9192, but skeletoncache's image uses 1717).
            # The uwsgi-exporter sidecar reads it there; keep this in sync with UWSGI_STATS_URL below.
            - name: metrics
              containerPort: 1717
          envFrom:
            - configMapRef:
                name: skeletoncache-config
          env:
            - name: GLOBAL_SERVER_URL
              value: https://{{ required "A valid .cluster.globalServer is required!" .Values.cluster.globalServer }}
            - name: AUTH_URI
              value: {{ required "A valid .cluster.globalServer is required!" .Values.cluster.globalServer }}/auth
            - name: STICKY_AUTH_URL
              value: {{ required "A valid .cluster.globalServer is required!" .Values.cluster.globalServer }}/sticky_auth
            - name: AUTH_URL
              value: {{ required "A valid .cluster.globalServer is required!" .Values.cluster.globalServer }}/auth
            - name: INFO_URL
              value: {{ required "A valid .cluster.globalServer is required!" .Values.cluster.globalServer }}/info
            - name: LIMITER_URI
              value: {{ .Values.skeletoncache.limiter.uri | quote }}
            - name: LIMITER_CATEGORIES
              value: {{ $cat := dict }}{{- range $k, $v := $categories }}{{- $_ := set $cat $k (printf "%v/minute" $v) -}}{{- end -}}{{ toJson $cat | squote }}
            - name: SKELETON_DATASTACK_NAME_REMAPPING
              value: {{ if .Values.skeletoncache.datastackRemap }}{{ .Values.skeletoncache.datastackRemap | squote }}{{ else }}{{ toJson .Values.skeletoncache.datastackRemapping | squote }}{{ end }}
            - name: SKELETONCACHE_WORKER_MAX_REPLICAS
              value: {{ .Values.skeletoncache.worker.maxReplicas | quote }}
            - name: SKELETON_CACHE_LOW_PRIORITY_EXCHANGE
              value: {{ .Values.skeletoncache.exchanges.low | default "" | quote }}
            - name: SKELETON_CACHE_HIGH_PRIORITY_EXCHANGE
              value: {{ .Values.skeletoncache.exchanges.high | default "" | quote }}
            - name: SKELETON_CACHE_LOW_PRIORITY_RETRIEVE_QUEUE
              value: {{ required "A valid .skeletoncache.queues.low is required!" .Values.skeletoncache.queues.low | quote }}
            - name: SKELETON_CACHE_HIGH_PRIORITY_RETRIEVE_QUEUE
              value: {{ required "A valid .skeletoncache.queues.high is required!" .Values.skeletoncache.queues.high | quote }}
            - name: SKELETON_CACHE_DEAD_LETTER_RETRIEVE_QUEUE
              value: {{ required "A valid .skeletoncache.queues.deadLetter is required!" .Values.skeletoncache.queues.deadLetter | quote }}
            - name: CACHE_NON_H5_SKELETONS
              value: {{ .Values.skeletoncache.cacheNonH5 | quote }}
            - name: VERBOSE_LEVEL
              value: {{ .Values.skeletoncache.verboseLevel | quote }}
            - name: DEBUG_ROOT_ID
              value: {{ .Values.skeletoncache.debugRootId | default "0" | quote }}
            - name: PROJECT_NAME
              value: {{ .Values.cluster.googleProject | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/home/nginx/.cloudvolume/secrets/google-secret.json"
          resources:
            requests:
              memory: {{ .Values.skeletoncache.api.resources.requests.memory }}
              cpu: {{ .Values.skeletoncache.api.resources.requests.cpu }}
          volumeMounts:
            - name: skeleton-config-volume
              mountPath: /app/skeletonservice/instance/
          {{- if .Values.skeletoncache.credentialsSecret }}
            - name: google-cloud-key
              mountPath: /home/nginx/.cloudvolume/secrets
          {{- end }}
          readinessProbe:
            httpGet:
              path: /skeletoncache/health
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /skeletoncache/health
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 60
        - name: uwsgi-exporter
          image: caveconnectome/uwsgi-export-workers:v14
          # Exposes the metrics endpoint on 0.0.0.0:9101
          ports:
              - containerPort: 9101
          env:
          # Where the exporter finds the uWSGI stats server. skeletoncache's uwsgi
          # serves stats on 1717 (NOT the 9192 fleet default); pointing at 9192 gives
          # connection-refused every scrape -> uwsgi_perc_busy_workers stuck at 0.
          # Must match the app's uwsgi --stats port (and the `metrics` containerPort above).
          - name: UWSGI_STATS_URL
            value: "http://localhost:1717"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: sysctl-buddy
          image: alpine:3.4
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                sysctl -w net.core.somaxconn=32768
                sysctl -w net.ipv4.ip_local_port_range='1024 65535'
                sleep 100
              done
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              memory: 10Mi
              cpu: 5m
      volumes:
        - name: skeleton-config-volume
          configMap:
            name: skeletoncache-config
      {{- if .Values.skeletoncache.credentialsSecret }}
        - name: google-cloud-key
          secret:
            secretName: {{ .Values.skeletoncache.credentialsSecret }}
      {{- end }}
