# Example overrides for unified auth chart
redis:
  host: "ref+tfstategs://my-tfstate-bucket/path/to/state?project=my-proj&name=my-state/output.auth_redis_host"

# Shared auth service settings
auth:
  image: "docker.io/caveconnectome/neuroglancer_auth:latest"
  dbName: "auth"
  secretKey: "ref+gcpsecrets://my-project/auth-secret-key-globalv1-default"
  defaultAdmins:
    - "you@example.org"
  # The Google OAuth 2.0 "Web application" client JSON. Created by hand in the
  # console (see GLOBAL_OAUTH_SETUP.md in terraform-google-cave) and stored in
  # Secret Manager; vals resolves the ref at helmfile time so the JSON never
  # lands in a file on disk or in this repo.
  secretFiles:
    - name: oauth-secret.json
      value: "ref+gcpsecrets://my-project/auth-oauth-client-globalv1"

# Regular API-facing auth
regular:
  enabled: true
  replicas: 2
  urlPrefix: "auth"

# Sticky admin-facing auth
sticky:
  enabled: true
  replicas: 1
  urlPrefix: "sticky_auth"
