name: release

on:
  push:
    branches:
      - main
      # Development branches publish to the SAME chart repo as main, which is
      # what lets one cluster test an unreleased chart while everyone else keeps
      # resolving the released one.
      #
      # The isolation is semver, not the repo: Helm's version resolution skips
      # prerelease versions unless they are pinned exactly or --devel is passed.
      # So a chart published from here as 5.27.1-dev.rayN is invisible to
      # `helm search repo` and to any range constraint, but a helmfile that pins
      # `version: 5.27.1-dev.ray5` gets it.
      #
      # This only works if the branch keeps using a PRERELEASE version in
      # Chart.yaml (x.y.z-dev.N / x.y.z-r.N). Publishing a plain x.y.z from a
      # development branch would make it the newest release for every consumer.
      - ray
      - "dev/**"

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"