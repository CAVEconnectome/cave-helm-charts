name: release

on:
  push:
    branches:
      - main
      # Development branches publish to the SAME chart repo as main, which is
      # what lets one cluster test an unreleased chart while everyone else keeps
      # resolving the released one.
      #
      # The isolation is semver, not the repo: Helm's version resolution skips
      # prerelease versions unless they are pinned exactly or --devel is passed.
      # So a chart published from here as 5.27.1-dev.rayN is invisible to
      # `helm search repo` and to any range constraint, but a helmfile that pins
      # `version: 5.27.1-dev.ray5` gets it.
      #
      # This only works if the branch keeps using a PRERELEASE version in
      # Chart.yaml (x.y.z-dev.N / x.y.z-r.N). Publishing a plain x.y.z from a
      # development branch would make it the newest release for every consumer.
      - ray
      - "dev/**"

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v3

      # The action downloads cr with a bare `curl -sSL` of the GitHub release URL, with no
      # retry or check. Since 2026-11-09 that URL often answers HTTP 504 with an HTML page
      # (for v1.5.0, v1.6.1 and v1.7.0 alike), which then fails to untar ("gzip: stdin:
      # not in gzip format"). The same asset downloads through the API, which is what
      # `gh release download` uses. So install cr here -- retried, checksum-verified --
      # into the directory the action checks; finding it, the action skips its download.
      - name: Install chart-releaser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_VERSION: v1.7.0
        run: |
          set -euo pipefail
          v="${CR_VERSION#v}"
          tarball="chart-releaser_${v}_linux_amd64.tar.gz"
          for attempt in 1 2 3 4 5; do
            if gh release download "$CR_VERSION" --repo helm/chart-releaser --clobber \
                 --pattern "$tarball" --pattern checksums.txt \
               && grep " ${tarball}\$" checksums.txt | sha256sum -c -; then
              break
            fi
            if [ "$attempt" = 5 ]; then echo "could not download cr $CR_VERSION" >&2; exit 1; fi
            sleep $((attempt * 15))
          done
          dir="$RUNNER_TOOL_CACHE/cr/$CR_VERSION/$(uname -m)"
          mkdir -p "$dir"
          tar -xzf "$tarball" -C "$dir"
          rm -f "$tarball" checksums.txt
          "$dir/cr" version

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          # must match the install step: the action looks for cr in
          # $RUNNER_TOOL_CACHE/cr/<version>/<arch> and downloads only if it is missing
          version: v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"